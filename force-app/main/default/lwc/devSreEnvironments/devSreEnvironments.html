<template>
  <section class="insights" aria-label="Ambientes e organizações Flosum">
    <header class="hero">
      <div class="hero-copy">
        <span class="hero-icon"><lightning-icon icon-name="standard:environment_hub" size="small" alternative-text=""></lightning-icon></span>
        <div>
          <p class="eyebrow">OPERAÇÕES POR ORGANIZAÇÃO</p>
          <h2>Ambientes</h2>
          <p class="subtitle">Acompanhe as operações Flosum por organização, sem cadastros ou vigências.</p>
        </div>
      </div>
      <div class="hero-actions">
        <lightning-button-icon icon-name="utility:refresh" variant="border-filled" alternative-text="Atualizar dados" title="Atualizar dados" onclick={handleRefresh} disabled={loading}></lightning-button-icon>
      </div>
    </header>

    <div class="filters" role="group" aria-label="Filtros operacionais">
      <lightning-record-picker data-org="organizationId" object-api-name="Flosum__Organisation__c" label="Organização Flosum" placeholder="Todas as organizações" value={organizationId} onchange={handleOrganization}></lightning-record-picker>
      <lightning-combobox name="period" label="Período de criação dos logs" value={period} options={periodOptions} onchange={handlePeriod}></lightning-combobox>
      <lightning-button label="Limpar" onclick={handleClear} disabled={loading}></lightning-button>
    </div>

    <template lwc:if={loading}><div class="spinner"><lightning-spinner alternative-text="Consultando Flosum" size="small"></lightning-spinner></div></template>
    <template lwc:elseif={error}><p class="error" role="alert">{error}</p></template>
    <template lwc:elseif={complete}>
      <div class="metrics">
        <template for:each={metrics} for:item="metric">
          <article key={metric.key} class="metric"><span>{metric.label}</span><strong>{metric.value}</strong></article>
        </template>
      </div>
      <template lwc:if={hasRows}>
        <div class="layout">
          <section class="panel" aria-label="Organizações e atividade operacional">
            <div class="panel-heading"><h3>Organizações Flosum</h3><span>{data.organizationCount} organizações neste recorte</span></div>
            <div class="table-scroll">
              <table class="org-table">
                <thead><tr><th scope="col">Organização</th><th scope="col">Deploys</th><th scope="col">Validações</th><th scope="col">Outras</th><th scope="col">Última atividade</th></tr></thead>
                <tbody>
                  <template for:each={rows} for:item="row">
                    <tr key={row.id} class={row.selectedClass}>
                      <td><button class="org-name" data-id={row.id} title={row.name} onclick={handleSelect}>{row.name}</button></td>
                      <td>{row.deployments}</td><td>{row.validations}</td><td>{row.otherOperations}</td>
                      <td><template lwc:if={row.lastActivity}><lightning-formatted-date-time value={row.lastActivity} day="2-digit" month="2-digit" year="numeric" hour="2-digit" minute="2-digit" time-zone="UTC"></lightning-formatted-date-time></template><template lwc:else>—</template></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
          <template lwc:if={hasSelection}>
            <aside class="panel detail" aria-label="Detalhes da organização">
              <div class="panel-heading">
                <h3 title={selected.name}>{selected.name}</h3>
                <lightning-button-icon icon-name="utility:close" alternative-text="Fechar detalhes" title="Fechar detalhes" onclick={handleClose}></lightning-button-icon>
              </div>
              <div class="detail-body">
                <p><strong>{selected.deployments}</strong> deployments · <strong>{selected.validations}</strong> validações</p>
                <p>{selected.successes} operações com sucesso · {selected.failures} com falha</p>
                <div class="detail-actions"><lightning-button label="Abrir organização" variant="brand-outline" icon-name="utility:new_window" data-id={selected.id} onclick={handleOpenOrg}></lightning-button></div>
                <h4>Últimas operações registradas</h4>
                <template for:each={selected.recent} for:item="log">
                  <div key={log.id} class="log-row">
                    <button data-id={log.id} onclick={handleOpenLog} title={log.name}>{log.name}</button>
                    <span title={log.processType}>{log.processType} · {log.result}</span>
                  </div>
                </template>
                <template lwc:if={selected.recent.length}></template>
              </div>
            </aside>
          </template>
        </div>
      </template>
      <template lwc:else><div class="empty">Nenhuma organização acessível nesta consulta.</div></template>
      <p class="footnote">Fonte: organizações e Metadata Logs Flosum acessíveis ao usuário. Período por criação do log (UTC). Resultados operacionais, não indicam disponibilidade da Salesforce nem constituem métricas DORA certificadas.</p>
    </template>
    <template lwc:else>
      <p class="error" role="status">A consulta ultrapassou o limite seguro de organizações ou logs. Selecione uma organização ou reduza o período para evitar totais parciais.</p>
    </template>
  </section>
</template>
