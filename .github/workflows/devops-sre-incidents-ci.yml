name: DevOps SRE Incident Intake CI

on:
  pull_request:
    paths:
      - '.github/workflows/devops-sre-incidents-ci.yml'
      - 'force-app/main/default/lwc/devSreIncidentIntake/**'
      - 'force-app/main/default/lwc/devSreIncidentsHost/**'
      - 'force-app/main/default/classes/DevSreIncidentController*'
      - 'force-app/main/default/objects/DevSre_Incident__c/**'
      - 'force-app/main/default/objects/DevSre_RecoveryAction__c/**'
      - 'force-app/main/default/permissionsets/DevSreIncident_*'
      - 'force-app/main/default/tabs/DevSre_Incident_Intake.tab-meta.xml'
      - 'force-app/main/default/tabs/incidentsRollbacks.tab-meta.xml'
      - 'manifest/sf-devops-sre-incident-intake.xml'
      - 'scripts/ci/verify-incident-metadata.py'
      - 'scripts/ci/verify-rm-review.py'
      - 'force-app/main/default/customPermissions/DevSre_ReviewIncidentCausality.customPermission-meta.xml'
      - 'manifest/sf-devops-sre-rm-review.xml'
      - 'manifest/sf-devops-sre-incidents-sandbox-validate.xml'
      - 'scripts/ci/verify-incident-sandbox-scope.py'
      - 'scripts/ci/sf-incident-sandbox-validate.sh'
      - 'scripts/ci/sf-incident-original-tab-report.py'
      - 'manifest/incidents-cleanup/**'
      - 'scripts/ci/sf-incident-cleanup-preflight.py'
      - 'scripts/ci/sf-incident-sandbox-cleanup.sh'
      - '.github/workflows/sf-devsrefeat-incidents-cleanup.yml'
      - 'tests/test_sf_incident_cleanup_preflight.py'
      - 'tests/test_sf_incident_original_tab_report.py'
      - '.github/workflows/sf-devsrefeat-incidents-validate.yml'
      - 'scripts/ci/sf-incident-chatops-intent.py'
      - 'tests/test_sf_incident_chatops_intent.py'
      - 'tests/test_sf_incident_component_diagnostics.py'
      - 'scripts/ci/sf-incident-component-diagnostics.py'
      - 'scripts/ci/sf-incident-apex-test-diagnostics.py'
      - 'tests/test_sf_incident_apex_test_diagnostics.py'
      - '.github/workflows/sf-devsrefeat-incidents-deploy.yml'
      - 'scripts/ci/sf-incident-sandbox-deploy.sh'
      - 'tests/test_sf_incident_explicit_deploy.py'
      - 'scripts/ci/incident-preview-counts.jq'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lwc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar XML e guardrails de segurança
        run: python3 scripts/ci/verify-incident-metadata.py
      - name: Validar controle de acesso dos RMs
        run: python3 scripts/ci/verify-rm-review.py
      - name: Validar allowlist da sandbox
        run: python3 scripts/ci/verify-incident-sandbox-scope.py
      - name: Validar proteções do ChatOps e sintaxe do workflow sandbox
        run: |
          python3 -m unittest discover -s tests -p 'test_sf_incident_chatops_intent.py' -v
          python3 -m unittest discover -s tests -p 'test_sf_incident_component_diagnostics.py' -v
          python3 -m unittest discover -s tests -p 'test_sf_incident_apex_test_diagnostics.py' -v
          python3 -m unittest discover -s tests -p 'test_sf_incident_original_tab_report.py' -v
          bash -n scripts/ci/sf-incident-sandbox-validate.sh
          bash -n scripts/ci/sf-incident-sandbox-deploy.sh
          bash -n scripts/ci/sf-incident-sandbox-cleanup.sh
          python3 -m unittest discover -s tests -p 'test_sf_incident_cleanup_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_sf_incident_explicit_deploy.py' -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint Incident Intake
        run: npx eslint force-app/main/default/lwc/devSreIncidentIntake/devSreIncidentIntake.js force-app/main/default/lwc/devSreIncidentsHost/devSreIncidentsHost.js
      - name: Jest Incident Intake
        run: npm run test:unit -- -- --runInBand --runTestsByPath force-app/main/default/lwc/devSreIncidentIntake/__tests__/devSreIncidentIntake.test.js force-app/main/default/lwc/devSreIncidentIntake/__tests__/devSreIncidentIntakeRm.test.js
