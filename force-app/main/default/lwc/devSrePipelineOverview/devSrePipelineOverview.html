<template>
  <div class="monitor ds-stack">
    <header class="monitor-header">
      <div class="ds-heading">
        <div class="hero-icon">
          <lightning-icon
            icon-name="utility:flow"
            variant="inverse"
            size="medium"
            alternative-text=""
          ></lightning-icon>
        </div>
        <div>
          <p class="eyebrow">Observabilidade de releases</p>
          <h1>Pipeline Monitor</h1>
          <p class="muted">Acompanhe as entregas Flosum entre ambientes.</p>
        </div>
      </div>
      <div class="overview-period-actions">
        <lightning-combobox data-filter name="period" label="Período (UTC)" value={draft.period} options={periodOptions} onchange={handleFilter}></lightning-combobox>
        <lightning-button-icon icon-name="utility:refresh" variant="border-filled" alternative-text="Atualizar monitor" title="Atualizar monitor" onclick={refresh} disabled={refreshDisabled}></lightning-button-icon>
      </div>
    </header>
    <template lwc:if={customPeriod}>
      <div class="overview-custom-range" role="group" aria-label="Período personalizado">
        <lightning-input data-filter name="fromDate" type="date" label="De (UTC)" value={draft.fromDate} required onchange={handleFilter}></lightning-input>
        <lightning-input data-filter name="toDate" type="date" label="Até (UTC)" value={draft.toDate} required onchange={handleFilter}></lightning-input>
        <lightning-button label="Aplicar período" variant="brand" onclick={applyFilters} disabled={loading}></lightning-button>
      </div>
    </template>
    <section aria-label="Resumo operacional" class="summary-section">
      <div class="summary-grid">
        <template for:each={summaryCards} for:item="card"
          ><div key={card.key} class={card.className}>
            <div class="metric-heading">
              <span>{card.label}</span
              ><lightning-helptext content={card.help}></lightning-helptext>
            </div>
            <strong>{card.value}</strong>
          </div></template
        >
      </div>
      <template lwc:if={summaryError}
        ><p class="ds-error" role="alert">{summaryError}</p></template
      >
      <template lwc:if={summaryUnavailable}
        ><p class="ds-banner" role="status">
          Resumo indisponível: mais de 2.000 registros de origem no período.
          Reduza o período ou filtre uma organização. A lista continua
          disponível.
        </p></template
      >
    </section>
    <section class="delivery-panel" aria-label="Entregas Flosum">
      <a data-download class="download-link" tabindex="-1" aria-hidden="true">Exportação</a>
      <template lwc:if={exportError}><p class="ds-error" role="alert">{exportError}</p></template>
      <div class="search-toolbar">
        <lightning-input
          data-filter
          name="search"
          type="search"
          variant="label-hidden"
          label="Buscar deployment ou Branch"
          placeholder="Buscar deployment ou Branch…"
          value={draft.search}
          maxlength="80"
          onchange={handleFilter}
          onkeydown={handleKey}
        ></lightning-input>
        <lightning-button
          label={filterLabel}
          icon-name="utility:filterList"
          onclick={handleToggleFilters}
          aria-expanded={filtersOpen}
          aria-controls="monitor-filters"
        ></lightning-button>
        <lightning-combobox
          data-filter
          name="environmentClass"
          label="Ambiente"
          variant="label-hidden"
          value={draft.environmentClass}
          options={environmentOptions}
          onchange={handleFilter}
        ></lightning-combobox>
        <lightning-button label="Exportar página" icon-name="utility:download" onclick={handleExport} disabled={exportDisabled}></lightning-button>
        <lightning-button
          variant="brand"
          label="Aplicar filtros"
          onclick={applyFilters}
          disabled={loading}
        ></lightning-button>
      </div>
      <template lwc:if={filtersOpen}>
        <div id="monitor-filters" class="filter-panel ds-stack">
          <div class="ds-filters">
            <lightning-combobox
              data-filter
              name="outcome"
              label="Resultado"
              value={draft.outcome}
              options={outcomeOptions}
              onchange={handleFilter}
            ></lightning-combobox
            ><lightning-record-picker data-filter name="organizationId" object-api-name="Flosum__Organisation__c" label="Organização Flosum" placeholder="Pesquisar organização..." value={draft.organizationId} onchange={handleOrganizationPicker}></lightning-record-picker>
          </div>

        </div>
      </template>
      <template lwc:if={error}
        ><p class="ds-error" role="alert">{error}</p></template
      >
      <template lwc:if={loading}
        ><div class="ds-loading">
          <lightning-spinner
            size="small"
            alternative-text="Atualizando Pipeline Monitor"
          ></lightning-spinner></div
      ></template>
      <template lwc:elseif={dirty}
        ><p class="ds-banner" role="status">
          Filtros alterados. Selecione Aplicar filtros para atualizar o monitor.
        </p></template
      >
      <template lwc:elseif={showRows}>
        <ul class="delivery-list">
          <template for:each={visibleRows} for:item="row"
            ><li key={row.id} class="delivery-row">
              <div class="row-icon row-icon-brand">
                <lightning-icon
                  icon-name="standard:deployment"
                  size="small"
                  alternative-text=""
                ></lightning-icon>
              </div>
              <div class="delivery-content">
                <div class="delivery-title">
                  <button
                    class="record-link"
                    data-id={row.id}
                    onclick={handleOpen}
                  >
                    {row.title}</button
                  ><span class="log-label">{row.name}</span>
                </div>
                <p class="row-meta">
                  <span class={row.environmentClassName}>{row.environmentLabel}</span
                  ><span>{row.organizationLabel}</span>
                </p>
                <lightning-helptext content={row.quality}></lightning-helptext>
              </div>
              <div class="row-result">
                <span class={row.resultClass}>{row.resultLabel}</span
                ><span class="duration">{row.durationLabel}</span
                ><span class="clock"
                  >{row.clockLabel}:
                  <lightning-formatted-date-time
                    value={row.clock}
                    day="2-digit"
                    month="2-digit"
                    hour="2-digit"
                    minute="2-digit"
                    time-zone="UTC"
                  ></lightning-formatted-date-time>
                  UTC</span
                >
              </div>
              <lightning-button-icon
                variant="border-filled"
                data-id={row.id}
                icon-name="utility:chevronright"
                alternative-text={row.openLabel}
                title={row.openLabel}
                onclick={handleOpen}
              ></lightning-button-icon></li
          ></template>
        </ul>
      </template>
      <template lwc:elseif={showEmpty}
        ><div class="ds-empty" role="status">
          <h2>Nenhuma entrega encontrada nesta página</h2>
          <p>{emptyDescription}</p>
        </div></template
      >
      <template lwc:if={showRows}
        ><div class="list-footer">
          <p class="muted" role="status">{pageLabel}</p>
          <div class="ds-actions">
            <template lwc:if={moreInPage}
              ><lightning-button
                label="Mostrar mais desta página"
                onclick={handleMore}
              ></lightning-button></template
            ><lightning-button
              label="Próxima página"
              onclick={handleNext}
              disabled={nextDisabled}
            ></lightning-button>
          </div></div
      ></template>
      <template lwc:if={showEmpty}
        ><div class="list-footer">
          <lightning-button
            label="Próxima página"
            onclick={handleNext}
            disabled={nextDisabled}
          ></lightning-button></div
      ></template>
      <template lwc:if={correlationIncomplete}
        ><p class="ds-banner">
          A fonte não garante unicidade das requisições. Revise a correlação
          antes de consolidar indicadores.
        </p></template
      >
    </section>

  </div>
</template>
