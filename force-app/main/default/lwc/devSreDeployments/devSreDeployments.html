<template>
  <lightning-card title="Deployments reais" icon-name="standard:deployment">
    <div class="slds-p-around_medium">
      <p class="slds-m-bottom_medium">
        Consulta operacional do Metadata Log. As métricas DORA permanecem não
        certificadas.
      </p>
      <div class="filters">
        <lightning-input
          type="date"
          name="fromDate"
          label="De (UTC)"
          value={fromDate}
          required
          onchange={handleChange}
        ></lightning-input>
        <lightning-input
          type="date"
          name="toDate"
          label="Até (UTC, inclusive)"
          value={toDate}
          required
          onchange={handleChange}
        ></lightning-input>
        <lightning-combobox
          name="environmentClass"
          label="Ambiente na conclusão"
          value={environmentClass}
          options={environmentOptions}
          onchange={handleChange}
        ></lightning-combobox>
        <lightning-combobox
          name="outcome"
          label="Resultado"
          value={outcome}
          options={outcomeOptions}
          onchange={handleChange}
        ></lightning-combobox>
        <lightning-input
          name="branchId"
          label="ID da Branch (opcional)"
          value={branchId}
          maxlength="18"
          onchange={handleChange}
        ></lightning-input>
        <lightning-input
          name="organizationSearch"
          type="search"
          label="Pesquisar organização"
          value={organizationSearch}
          maxlength="80"
          onchange={handleChange}
        ></lightning-input>
        <lightning-button
          label="Buscar organizações"
          onclick={handleSearchOrganizations}
          disabled={loading}
        ></lightning-button>
        <lightning-combobox
          name="organizationId"
          label="Organização"
          value={organizationId}
          options={organizations}
          onchange={handleChange}
        ></lightning-combobox>
      </div>
      <template lwc:if={organizationsHaveMore}
        ><p role="status">
          Mais de 50 organizações. Refine a pesquisa para localizar outras.
        </p></template
      >
      <lightning-button
        class="slds-m-top_medium"
        variant="brand"
        label="Consultar / atualizar"
        onclick={handleSearch}
        disabled={loading}
      ></lightning-button>
      <p class="slds-text-body_small slds-m-top_medium">
        Ordenação pela criação do log. Sem conclusão, o período usa
        início/criação como referência operacional; o ambiente permanece
        UNKNOWN. Datas da tabela em UTC.
      </p>
      <template lwc:if={error}
        ><div
          class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small"
          role="alert"
        >
          {error}
        </div></template
      >
      <template lwc:if={loading}
        ><div class="loading">
          <lightning-spinner
            alternative-text="Consultando deployments"
            size="small"
          ></lightning-spinner></div
      ></template>
      <template lwc:else>
        <p class="slds-m-vertical_small" role="status">{statusLabel}</p>
        <template lwc:if={hasRows}
          ><lightning-datatable
            key-field="id"
            data={rows}
            columns={columns}
            onrowaction={handleRowAction}
            hide-checkbox-column
          ></lightning-datatable
        ></template>
        <template lwc:else
          ><p role="status">
            Nenhum deployment corresponde aos filtros nesta página. Se houver
            mais registros, avance para continuar a consulta.
          </p></template
        >
        <template lwc:if={correlationIncomplete}
          ><p class="slds-text-color_error" role="status">
            A fonte não garante unicidade das requisições. Revise a correlação
            antes de qualquer consolidação.
          </p></template
        >
        <template lwc:if={hasMore}
          ><p class="slds-m-top_small" role="status">
            Há mais registros de origem a examinar.
          </p></template
        >
        <lightning-button
          class="slds-m-top_medium"
          label="Próxima página"
          onclick={handleNext}
          disabled={nextDisabled}
        ></lightning-button>
      </template>
    </div>
  </lightning-card>
</template>
