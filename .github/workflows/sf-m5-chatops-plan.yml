# M5.2: explicit owner-authored GitHub Issue -> Salesforce dry-run only.
# This is NOT workflow_dispatch, does not use issue comments and cannot deploy.
name: Salesforce DevOps - M5 ChatOps PLAN

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: sf-devsrefeat-read
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name == 'issues' && github.event.action == 'opened' && github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && github.event.sender.login == github.repository_owner && startsWith(github.event.issue.title, 'SDOA PLAN ') && github.ref == 'refs/heads/master' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.intent.outputs.target }}
      package_id: ${{ steps.intent.outputs.package_id }}
      issue_number: ${{ steps.intent.outputs.issue_number }}
      github_environment: ${{ steps.registry.outputs.github_environment }}
      instance_url: ${{ steps.registry.outputs.instance_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate M4/M5 security policy and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/sf-general-deploy.sh
          python3 -m unittest discover -s tests -p 'test_sf_*.py' -v
      - name: Verify trusted PLAN Issue
        id: intent
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci/sf-m5-chatops-intent.py --event "$GITHUB_EVENT_PATH" --owner "$OWNER" --repository "$REPOSITORY" --output-file "$GITHUB_OUTPUT"
      - name: Resolve approved environment and manifest
        id: registry
        env:
          TARGET: ${{ steps.intent.outputs.target }}
          PACKAGE_ID: ${{ steps.intent.outputs.package_id }}
        run: python3 scripts/ci/sf-deploy-policy.py resolve --target "$TARGET" --package "$PACKAGE_ID" --output-file "$GITHUB_OUTPUT"
      - name: Set up Node.js for LWC tests
        if: ${{ steps.intent.outputs.package_id == 'clone-pipeline-lwc' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Jest dependencies
        if: ${{ steps.intent.outputs.package_id == 'clone-pipeline-lwc' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run reviewed LWC Jest suite
        if: ${{ steps.intent.outputs.package_id == 'clone-pipeline-lwc' }}
        run: |
          set -euo pipefail
          npm run test:unit -- --runInBand --runTestsByPath force-app/main/default/lwc/clonePipelineAction/__tests__/clonePipelineAction.test.js

  plan:
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    environment:
      name: ${{ needs.resolve.outputs.github_environment }}
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
      SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
      EXPECTED_INSTANCE_URL: ${{ needs.resolve.outputs.instance_url }}
      GITHUB_ENVIRONMENT_NAME: ${{ needs.resolve.outputs.github_environment }}
      OPERATION: plan
      TARGET: ${{ needs.resolve.outputs.target }}
      PACKAGE_ID: ${{ needs.resolve.outputs.package_id }}
      CONFIRMATION: ''
    steps:
      - name: Checkout exact reviewed master SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Salesforce CLI runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Reverify Issue intent and run M4.2 Salesforce PLAN
        shell: bash
        run: bash scripts/ci/sf-general-deploy.sh
      - name: Publish fixed-shape PLAN outcome
        if: ${{ success() }}
        env:
          ISSUE: ${{ needs.resolve.outputs.issue_number }}
        run: |
          echo "SDOA_M5_PLAN_SUCCEEDED: issue=$ISSUE operation=plan real_deploy=false"
