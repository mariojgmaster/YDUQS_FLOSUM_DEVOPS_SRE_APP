<template>
  <div class="cd-shell">
    <header class="cd-heading">
      <div>
        <p class="cd-eyebrow">PESQUISA POR COMPONENTE · FLOSum</p>
        <h2>Branch Describer</h2>
        <p>Localize registros de componentes e suas Branches vinculadas, usando dados acessíveis do Flosum.</p>
      </div>
    </header>
    <section class="cd-controls" aria-label="Pesquisa de componentes">
      <div class="cd-search-field">
        <lightning-input type="search" label="Component Name" placeholder="Pesquisar nome real do componente…" value={search} onchange={handleChange} max-length="81"></lightning-input>
      </div>
      <div class="cd-type-field">
        <lightning-input type="search" label="Component Type" placeholder="Pesquisar tipo de componente…" value={typeText} onfocus={handleTypeFocus} onchange={handleTypeChange} onkeydown={handleTypeKey} max-length="81"></lightning-input>
        <template lwc:if={typeMenuOpen}>
          <div class="cd-type-menu">
            <template lwc:if={typeLoading}><div class="cd-type-message" role="status">Consultando tipos…</div></template>
            <template lwc:elseif={typeError}><div class="cd-type-message" role="alert">{typeError}</div></template>
            <template lwc:elseif={hasTypeOptions}>
              <ul class="cd-type-list" role="listbox" aria-label="Tipos de componente">
                <template for:each={typeOptions} for:item="option">
                  <li role="presentation" key={option.value}><button class="cd-type-option" type="button" role="option" data-value={option.value} onclick={handleTypeSelect} title={option.label}>{option.label}</button></li>
                </template>
              </ul>
              <p class="cd-type-hint">Até 20 opções. Digite para refinar a pesquisa.</p>
            </template>
            <template lwc:else><div class="cd-type-message" role="status">Nenhum tipo encontrado.</div></template>
          </div>
        </template>
      </div>
      <div class="cd-control-actions">
        <template lwc:if={isTypeSelected}><lightning-button label="Limpar tipo" onclick={handleTypeClear}></lightning-button></template>
        <lightning-button-icon icon-name="utility:refresh" alternative-text="Atualizar pesquisa" title="Atualizar pesquisa" disabled={loading} onclick={handleRefresh}></lightning-button-icon>
        <lightning-button label="Limpar filtros" onclick={handleReset}></lightning-button>
      </div>
      <template lwc:if={helpText}><p class="cd-help" role="status">{helpText}</p></template>
    </section>
    <div class="cd-notice" role="note">
      <strong>Identidade:</strong> a pesquisa utiliza <code>Flosum__Component_Name__c</code>, e não o número automático (<code>Name</code>).
      O nome registrado no Flosum não comprova, sozinho, o FullName canônico. A versão exibida é o campo registrado no Component,
      não uma revisão verificada de código nem prova de deploy.
    </div>
    <div class={layoutClass}>
      <template lwc:if={showResults}>
      <section class="cd-panel" aria-label="Componentes encontrados">
        <header class="cd-panel-head"><h3>Ocorrências encontradas</h3><span>{results.length} nesta consulta</span></header>
        <template lwc:if={loading}><div class="cd-loading cd-loading_skeleton" role="status"><div class="cd-skeleton" aria-hidden="true"><span></span><span></span><span></span></div><lightning-spinner size="small" alternative-text="Buscando componentes"></lightning-spinner></div></template>
        <template lwc:elseif={error}><div class="cd-state cd-state_error" role="alert"><lightning-icon icon-name="utility:error" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Não foi possível consultar os componentes</strong><p>{error}</p><div class="cd-state-actions"><lightning-button label="Tentar pesquisa novamente" onclick={handleRetrySearch}></lightning-button></div></div></div></template>
        <template lwc:else>
          <template lwc:if={hasResults}>
            <div class="cd-scroller">
              <table class="cd-table">
                <thead><tr><th scope="col">Component Name / Nº</th><th scope="col">Component Type</th><th scope="col">Source / Versão</th><th scope="col">Branch</th><th scope="col">Acessar</th></tr></thead>
                <tbody>
                  <template for:each={entries} for:item="entry">
                    <tr key={entry.id} class={entry.rowClass}>
                      <td><span class="cd-mobile-field-label" aria-hidden="true">Componente / Nº</span><button type="button" class="cd-link" data-id={entry.id} onclick={handleSelect} title={entry.displayName}>{entry.displayName}</button><span class="cd-record-number">{entry.name}</span></td>
                      <td><span class="cd-mobile-field-label" aria-hidden="true">Component Type</span><span title={entry.typeLabel}>{entry.typeLabel}</span></td>
                      <td><span class="cd-mobile-field-label" aria-hidden="true">Source / Versão</span><span title={entry.displaySource}>{entry.displaySource}</span><span class="cd-record-number">v{entry.displayVersion}</span></td>
                      <td><span class="cd-mobile-field-label" aria-hidden="true">Branch</span><template lwc:if={entry.branchId}><button type="button" class="cd-link" data-id={entry.branchId} onclick={handleOpenBranch} title={entry.branchName}>{entry.branchName}</button></template><template lwc:else><span title={entry.branchName}>{entry.branchName}</span></template></td>
                      <td><span class="cd-mobile-field-label" aria-hidden="true">Acessar</span><button type="button" class="cd-link" data-id={entry.id} onclick={handleOpenComponent}>Flosum</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="cd-pager"><span>Consulta paginada; não representa o inventário global.</span><lightning-button label="Carregar mais" onclick={handleNext} disabled={nextDisabled}></lightning-button></div>
          </template>
          <template lwc:elseif={noMatches}>
            <template lwc:if={emptyWithoutFilters}><div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Nenhum componente acessível nesta consulta</strong><p>Nenhum componente acessível nesta consulta. Verifique permissões e compartilhamento de registros Flosum; a consulta não representa todo o inventário.</p><div class="cd-state-actions"><lightning-button label="Atualizar pesquisa" onclick={handleRetrySearch}></lightning-button></div></div></div></template>
            <template lwc:else><div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Nenhum resultado com esses filtros</strong><p>Nenhum componente acessível corresponde aos filtros informados. Experimente limpar o nome ou o tipo.</p><div class="cd-state-actions"><lightning-button label="Limpar filtros da pesquisa" onclick={handleReset}></lightning-button></div></div></div></template>
          </template>
          <template lwc:else><p class="cd-empty">Carregando o inventário acessível de componentes Flosum.</p></template>
        </template>
      </section>
      </template>
      <aside class="cd-panel cd-detail" aria-label="Detalhes do componente selecionado">
        <template lwc:if={detailLoading}><div class="cd-loading cd-loading_skeleton" role="status"><div class="cd-skeleton" aria-hidden="true"><span></span><span></span><span></span></div><lightning-spinner size="small" alternative-text="Carregando ficha e histórico"></lightning-spinner></div></template>
        <template lwc:elseif={detailError}><div class="cd-state cd-state_error" role="alert"><lightning-icon icon-name="utility:error" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Não foi possível carregar a ficha</strong><p>{detailError}</p><p>Se o registro não estiver acessível, confira permissões e compartilhamento no Flosum.</p><div class="cd-state-actions"><lightning-button label="Tentar carregar ficha novamente" onclick={handleRetryDetail}></lightning-button></div></div></div></template>
        <template lwc:elseif={hasDetail}>
          <header class="cd-panel-head">
            <div class="cd-detail-heading"><h3 title={detailName}>{detailName}</h3><span class="cd-record-number">{detailNumber}</span></div>
            <div class="cd-detail-actions">
              <template lwc:if={detailExpanded}>
                <lightning-button label="Voltar à lista" icon-name="utility:back" onclick={handleToggleDetailFocus}></lightning-button>
              </template>
              <template lwc:else>
                <lightning-button label="Expandir detalhes" icon-name="utility:expand" onclick={handleToggleDetailFocus}></lightning-button>
              </template>
              <lightning-button-icon icon-name="utility:close" alternative-text="Fechar detalhe" onclick={handleClose}></lightning-button-icon>
            </div>
          </header>
          <template lwc:if={showWorkspaceNav}>
            <nav class="cd-workspace-path" aria-label="Caminho de navegação dos componentes">
              <button type="button" class="cd-link" onclick={handleBackToList}>Inventário</button>
              <span aria-hidden="true">/</span>
              <span class="cd-workspace-identity" title={detailName}>{detailName}</span>
              <span aria-hidden="true">/</span>
              <strong>{workspaceLabel}</strong>
            </nav>
            <nav class="cd-workspace-nav" aria-label="Seções do componente">
              <lightning-button data-tab="ficha" label="Ficha" variant={fichaVariant}
                onclick={handleNavigateWorkspace}></lightning-button>
              <lightning-button data-tab="historicos" label="Históricos" variant={historiesVariant}
                onclick={handleNavigateWorkspace}></lightning-button>
              <lightning-button data-tab="arquivos" label="Arquivos ZIP" variant={zipVariant}
                disabled={archiveNavigationDisabled} onclick={handleNavigateWorkspace}></lightning-button>
              <lightning-button data-tab="comparar" label="Comparar" variant={compareVariant}
                disabled={compareNavigationDisabled} onclick={handleNavigateWorkspace}></lightning-button>
            </nav>
          </template>
          <div class="cd-detail-body">
            <template lwc:if={showFactsSection}>
            <section class="cd-facts" aria-label="Ficha do componente no Flosum">
              <h4 class="cd-section-title">Ficha do componente</h4>
              <dl class="cd-facts-grid">
                <div class="cd-fact"><dt>Component Type</dt><dd>{detailType}</dd></div>
                <div class="cd-fact"><dt>Versão registrada</dt><dd>{detailVersion}</dd></div>
                <div class="cd-fact"><dt>Source</dt><dd>{detailSource}</dd></div>
                <div class="cd-fact"><dt>Source Details</dt><dd>{detailSourceDetails}</dd></div>
                <div class="cd-fact"><dt>Branch vinculada</dt><dd>
                  <template lwc:if={detailBranchId}>
                    <button type="button" class="cd-link" data-id={detailBranchId}
                      title={detailBranchName} onclick={handleOpenBranch}>{detailBranchName}</button>
                  </template>
                  <template lwc:else>{detailBranchName}</template>
                </dd></div>
                <template lwc:if={detailChangedOn}>
                  <div class="cd-fact"><dt>Alterado em (UTC)</dt><dd>
                    <lightning-formatted-date-time value={detailChangedOn} time-zone="UTC"
                      day="2-digit" month="2-digit" year="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                  </dd></div>
                </template>
                <template lwc:if={detailCommittedOn}>
                  <div class="cd-fact"><dt>Commit registrado em (UTC)</dt><dd>
                    <lightning-formatted-date-time value={detailCommittedOn} time-zone="UTC"
                      day="2-digit" month="2-digit" year="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                  </dd></div>
                </template>
              </dl>
              <p class="cd-muted cd-facts-note">Dados registrados no Flosum. O vínculo com a Branch e a versão informada não comprovam implantação nem revisão de código.</p>
            </section>
            </template>
            <template lwc:if={showHistorySection}>
            <section class="cd-history-section" aria-label="Históricos relacionados ao componente">
              <header class="cd-section-header">
                <h4 class="cd-section-title">Component Histories relacionados</h4>
                <template lwc:if={hasHistoryCount}>
                  <span class="cd-history-count" aria-live="polite">{historyCountLabel}</span>
                </template>
              </header>

              <template lwc:if={canCompareHistories}>
                <lightning-button label="Comparar históricos" icon-name="utility:compare"
                  onclick={handleCompareToggle} variant="neutral"></lightning-button>
              </template>
              <template lwc:if={historyUnavailable}>
                <div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Fonte histórica indisponível</strong><p>A fonte histórica não está acessível ou não foi possível comprovar sua ligação. Verifique o acesso Flosum e o vínculo antes de continuar.</p><div class="cd-state-actions"><lightning-button label="Reconsultar ficha" onclick={handleRetryDetail}></lightning-button></div></div></div>
              </template>
              <template lwc:else>
                <template lwc:if={hasHistories}>
                  <ol class="cd-history-list" aria-label="Históricos acessíveis mais recentes">
                    <template for:each={historyRows} for:item="history">
                      <li key={history.id} class={history.rowClass}>
                        <div class="cd-history-info">
                          <span class="cd-history-sequence">Histórico {history.sequence}</span>
                          <lightning-formatted-date-time value={history.createdAt} time-zone="UTC"
                            day="2-digit" month="2-digit" year="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                        </div>
                        <div class="cd-history-actions">
                          <button type="button" class="cd-link" data-id={history.id} onclick={handleOpenHistory}>Abrir no Flosum</button>
                          <lightning-button label="Explorar ZIP" icon-name="utility:open_folder"
                            variant="neutral" data-id={history.id} onclick={handleExploreHistory}></lightning-button>
                        </div>
                      </li>
                    </template>
                  </ol>
                  <template lwc:if={hasHistoryMore}>
                    <p class="cd-muted">Mais registros existem além dos 20 históricos exibidos.</p>
                  </template>
                </template>
                <template lwc:else>
                  <div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Sem históricos acessíveis</strong><p>Nenhum histórico acessível neste vínculo consultado. Isso não comprova a ausência de versões em outros vínculos.</p><div class="cd-state-actions"><lightning-button label="Atualizar ficha" onclick={handleRetryDetail}></lightning-button></div></div></div>
                </template>
              </template>
            </section>
            </template>
            <template lwc:if={showCompareSection}>
              <section class="cd-compare-panel" aria-label="Comparação de históricos do Flosum">
                <header class="cd-compare-head">
                  <div>
                    <h4 class="cd-section-title">Diff entre históricos</h4>
                    <p class="cd-muted">Comparação do mesmo caminho de arquivo em dois ZIPs vinculados a este registro. Não comprova commit nem deploy.</p>
                  </div>
                  <lightning-button-icon icon-name="utility:close" alternative-text="Fechar comparação"
                    title="Fechar comparação" onclick={handleCompareClose}></lightning-button-icon>
                </header>
                <div class="cd-compare-selectors">
                  <lightning-combobox label="Histórico base" data-side="base"
                    options={historyCompareOptions} value={compareBaseId}
                    onchange={handleCompareHistoryChange}></lightning-combobox>
                  <div class="cd-compare-swap">
                    <lightning-button-icon icon-name="utility:swap" alternative-text="Inverter históricos"
                      title="Inverter base e destino" onclick={handleSwapHistories}></lightning-button-icon>
                  </div>
                  <lightning-combobox label="Histórico de destino" data-side="target"
                    options={historyCompareOptions} value={compareTargetId}
                    onchange={handleCompareHistoryChange}></lightning-combobox>
                </div>
                <template lwc:if={compareLoading}>
                  <div class="cd-loading cd-loading_skeleton" role="status"><div class="cd-skeleton" aria-hidden="true"><span></span><span></span><span></span></div><lightning-spinner size="small" alternative-text="Consultando arquivos para comparação"></lightning-spinner></div>
                </template>
                <template lwc:elseif={compareError}>
                  <div class="cd-state cd-state_error" role="alert"><lightning-icon icon-name="utility:error" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Não foi possível comparar os históricos</strong><p>{compareError}</p><div class="cd-state-actions"><lightning-button label="Reconsultar arquivos para comparação" onclick={handleRetryCompare}></lightning-button></div></div></div>
                </template>
                <template lwc:elseif={hasComparePaths}>
                  <div class="cd-compare-file">
                    <lightning-combobox label="Arquivo de texto presente nos dois ZIPs"
                      placeholder="Selecione um arquivo para comparar" value={comparePath}
                      options={compareFileOptions} onchange={handleCompareFileChange}></lightning-combobox>
                  </div>
                  <template lwc:if={compareWarning}><p class="cd-empty" role="status">{compareWarning}</p></template>
                  <template lwc:if={hasCompareRows}>
                    <div class="cd-compare-summary" role="status">
                      <span>+{compareAdded} linhas adicionadas</span>
                      <span>−{compareRemoved} linhas removidas</span>
                      <template lwc:if={compareUnchanged}><span>Conteúdo idêntico</span></template>
                    </div>
                    <div class="cd-diff-toolbar" role="group" aria-label="Modo de visualização do Diff">
                      <lightning-button-group>
                        <lightning-button label="Lado a lado" variant={allLinesButtonVariant} onclick={handleDiffModeAll}></lightning-button>
                        <lightning-button label="Apenas alterações" variant={onlyChangesButtonVariant} onclick={handleDiffModeChanged}></lightning-button>
                      </lightning-button-group>
                      <span class="cd-muted">Vertical compartilhado · horizontal independente</span>
                    </div>
                    <template lwc:if={hasNoChangedLines}>
                      <p class="cd-empty" role="status">Os dois arquivos têm conteúdo idêntico. Não há alterações para exibir.</p>
                    </template>
                    <template lwc:else>
                      <div class="cd-mobile-compare-switch" role="group" aria-label="Escolha o histórico visível em telas pequenas">
                        <button type="button" class={mobileBaseControlClass} aria-pressed={mobileBaseSelected}
                          onclick={handleMobileShowBase}>Ver base</button>
                        <button type="button" class={mobileTargetControlClass} aria-pressed={mobileTargetSelected}
                          onclick={handleMobileShowTarget}>Ver destino</button>
                      </div>
                      <div class="cd-diff-viewport" role="region" tabindex="0"
                        aria-label="Comparação de código com uma única rolagem vertical para Base e Destino">
                        <div class="cd-diff-panes" role="group" aria-label="Código em duas colunas com linhas alinhadas">
                        <div class={mobileBasePaneClass}>
                          <header class="cd-diff-pane-title">Histórico base</header>
                          <section class="cd-diff-pane" tabindex="0" role="region" data-side="base"
                            aria-label="Código do histórico base; rolagem horizontal independente">
                          <div class="cd-diff-pane-lines">
                            <template for:each={diffBaseRows} for:item="line">
                              <div key={line.key} class={line.className}>
                                <span class="cd-diff-number">{line.line}</span>
                                <pre><code>{line.text}</code></pre>
                              </div>
                            </template>
                          </div>
                          </section>
                        </div>
                        <div class={mobileTargetPaneClass}>
                          <header class="cd-diff-pane-title">Histórico de destino</header>
                          <section class="cd-diff-pane" tabindex="0" role="region" data-side="target"
                            aria-label="Código do histórico de destino; rolagem horizontal independente">
                          <div class="cd-diff-pane-lines">
                            <template for:each={diffTargetRows} for:item="line">
                              <div key={line.key} class={line.className}>
                                <span class="cd-diff-number">{line.line}</span>
                                <pre><code>{line.text}</code></pre>
                              </div>
                            </template>
                          </div>
                          </section>
                        </div>
                        </div>
                      </div>
                      <div class="cd-diff-pagination" role="group" aria-label="Navegação entre blocos de linhas">
                        <lightning-button label="Bloco anterior" onclick={handleDiffPrevious}
                          disabled={diffPreviousDisabled}></lightning-button>
                        <span class="cd-muted" role="status">{diffPageLabel}</span>
                        <lightning-button label="Próximo bloco" onclick={handleDiffNext}
                          disabled={diffNextDisabled}></lightning-button>
                      </div>
                    </template>
                  </template>
                </template>
                <template lwc:else>
                  <div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Sem arquivos comparáveis</strong><p>Não há arquivos de texto com o mesmo caminho, acessíveis nos dois ZIPs selecionados. Escolha outros históricos acima para uma nova consulta.</p></div></div>
                </template>
                <p class="cd-muted cd-compare-foot">Somente leitura · rolagem vertical única · horizontal independente em cada coluna · todas as linhas disponíveis por blocos navegáveis.</p>
              </section>
            </template>
            <template lwc:if={showArchiveSection}>
              <section class="cd-archive-panel" aria-label="Explorador ZIP do histórico">
                <div class="cd-archive-head">
                  <div><h4>Arquivos do histórico</h4><p class="cd-muted">{archiveName} · pré-visualização de texto, somente leitura</p></div>
                  <lightning-button-icon icon-name="utility:close" title="Fechar ZIP" alternative-text="Fechar explorador" onclick={handleArchiveClose}></lightning-button-icon>
                </div>
                <template lwc:if={archiveLoading}><div class="cd-loading cd-loading_skeleton" role="status"><div class="cd-skeleton" aria-hidden="true"><span></span><span></span><span></span></div><lightning-spinner size="small" alternative-text="Abrindo arquivo ZIP"></lightning-spinner></div></template>
                <template lwc:elseif={archiveError}><div class="cd-state cd-state_error" role="alert"><lightning-icon icon-name="utility:error" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Não foi possível abrir o conteúdo do ZIP</strong><p>{archiveError}</p><p>O acesso pode estar restrito, ou o tamanho pode exceder os recursos disponíveis no Apex.</p><div class="cd-state-actions"><lightning-button label="Tentar abrir ZIP novamente" onclick={handleRetryArchive}></lightning-button></div></div></div></template>
                <template lwc:elseif={hasArchiveEntries}>
                  <template lwc:if={hasPreviewableArchiveEntries}>
                  <div class="cd-archive-toolbar">
                    <lightning-input type="search" label="Localizar arquivo no ZIP" placeholder="Filtrar arquivos pelo caminho…" value={archiveFilter} onchange={handleArchiveFilterChange}></lightning-input>
                    <span class="cd-muted" aria-live="polite">{archiveMatchCount} de {archiveTotalCount} arquivos</span>
                  </div>
                  <template lwc:if={hasMatchingArchiveEntries}>
                  <div class="cd-archive-grid">
                    <div class="cd-archive-files" role="group" aria-label="Arquivos no ZIP">
                      <template for:each={archiveEntries} for:item="entry">
                        <button key={entry.path} type="button" class={entry.rowClass}
                          data-path={entry.path} onclick={handleSelectArchiveFile}
                          disabled={entry.disabled} title={entry.path}>{entry.path}</button>
                      </template>
                    </div>
                    <div class="cd-archive-preview" role="region" tabindex="0" aria-label="Visualização do arquivo ZIP com rolagem horizontal e vertical">
                      <template lwc:if={hasArchiveText}>
                        <p class="cd-archive-filename">{archiveFileName}</p>
                        <pre class="cd-archive-code"><code>{archiveContent}</code></pre>
                      </template>
                      <template lwc:else>
                        <p class="cd-empty">Selecione um arquivo de texto para ler seu conteúdo. Binários e arquivos grandes ficam bloqueados.</p>
                      </template>
                    </div>
                  </div>
                  </template>
                  <template lwc:else><div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Nenhum arquivo corresponde ao filtro</strong><p>Nenhum arquivo corresponde ao filtro informado. Limpe o filtro para voltar à lista do ZIP.</p><div class="cd-state-actions"><lightning-button label="Limpar filtro do ZIP" onclick={handleArchiveClearFilter}></lightning-button></div></div></div></template>
                  </template>
                  <template lwc:else><div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>ZIP sem texto compatível</strong><p>O ZIP contém entradas, mas nenhuma está disponível para pré-visualização textual nesta consulta.</p><div class="cd-state-actions"><lightning-button label="Voltar aos históricos" onclick={handleArchiveClose}></lightning-button></div></div></div></template>
                </template>
                <template lwc:else><div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>ZIP sem arquivos disponíveis</strong><p>Não foram encontrados arquivos disponíveis neste ZIP. Confira a origem do anexo e o acesso ao histórico.</p><div class="cd-state-actions"><lightning-button label="Voltar aos históricos" onclick={handleArchiveClose}></lightning-button></div></div></div></template>
                <p class="cd-muted cd-archive-footnote">Limite configurado de até 6 MiB por arquivo de texto e ZIP; abertura sujeita ao heap Apex disponível. Até 200 entradas. Nenhum conteúdo é executado ou alterado.</p>
              </section>
            </template>
            <div class="cd-caution" role="note">O Diff compara somente conteúdo de arquivos ZIP de dois Histories vinculados ao mesmo Component. Não estabelece identidade canônica, equivalência a versões Git ou evidência de implantação. Não exibir histórico de deploy sem evidência direta.</div>
          </div>
        </template>
        <template lwc:else><div class="cd-state" role="status"><lightning-icon icon-name="utility:info" size="small" alternative-text=""></lightning-icon><div class="cd-state-content"><strong>Selecione um componente</strong><p>Selecione uma ocorrência para visualizar a Branch, a ficha e os históricos diretamente relacionados.</p><div class="cd-state-actions"><lightning-button label="Atualizar inventário" onclick={handleRetrySearch}></lightning-button></div></div></div></template>
      </aside>
    </div>
  </div>
</template>
