<template>
  <div class="cd-shell">
    <header class="cd-heading">
      <div>
        <p class="cd-eyebrow">PESQUISA POR COMPONENTE · FLOSum</p>
        <h2>Branch Describer</h2>
        <p>Localize registros de componentes e suas Branches vinculadas, usando dados acessíveis do Flosum.</p>
      </div>
    </header>
    <section class="cd-controls" aria-label="Pesquisa de componentes">
      <div class="cd-search-field">
        <lightning-input type="search" label="Component Name" placeholder="Pesquisar nome real do componente…" value={search} onchange={handleChange} max-length="81"></lightning-input>
      </div>
      <div class="cd-type-field">
        <lightning-input type="search" label="Component Type" placeholder="Pesquisar tipo de componente…" value={typeText} onfocus={handleTypeFocus} onchange={handleTypeChange} onkeydown={handleTypeKey} max-length="81"></lightning-input>
        <template lwc:if={typeMenuOpen}>
          <div class="cd-type-menu">
            <template lwc:if={typeLoading}><div class="cd-type-message" role="status">Consultando tipos…</div></template>
            <template lwc:elseif={typeError}><div class="cd-type-message" role="alert">{typeError}</div></template>
            <template lwc:elseif={hasTypeOptions}>
              <ul class="cd-type-list" role="listbox" aria-label="Tipos de componente">
                <template for:each={typeOptions} for:item="option">
                  <li role="presentation" key={option.value}><button class="cd-type-option" type="button" role="option" data-value={option.value} onclick={handleTypeSelect} title={option.label}>{option.label}</button></li>
                </template>
              </ul>
              <p class="cd-type-hint">Até 20 opções. Digite para refinar a pesquisa.</p>
            </template>
            <template lwc:else><div class="cd-type-message" role="status">Nenhum tipo encontrado.</div></template>
          </div>
        </template>
      </div>
      <div class="cd-control-actions">
        <template lwc:if={isTypeSelected}><lightning-button label="Limpar tipo" onclick={handleTypeClear}></lightning-button></template>
        <lightning-button-icon icon-name="utility:refresh" alternative-text="Atualizar pesquisa" title="Atualizar pesquisa" disabled={loading} onclick={handleRefresh}></lightning-button-icon>
        <lightning-button label="Limpar filtros" onclick={handleReset}></lightning-button>
      </div>
      <template lwc:if={helpText}><p class="cd-help" role="status">{helpText}</p></template>
    </section>
    <div class="cd-notice" role="note">
      <strong>Identidade:</strong> a pesquisa utiliza <code>Flosum__Component_Name__c</code>, e não o número automático (<code>Name</code>).
      O nome registrado no Flosum não comprova, sozinho, o FullName canônico. A versão exibida é o campo registrado no Component,
      não uma revisão verificada de código nem prova de deploy.
    </div>
    <div class={layoutClass}>
      <template lwc:if={showResults}>
      <section class="cd-panel" aria-label="Componentes encontrados">
        <header class="cd-panel-head"><h3>Ocorrências encontradas</h3><span>{results.length} nesta consulta</span></header>
        <template lwc:if={loading}><div class="cd-loading"><lightning-spinner size="small" alternative-text="Buscando componentes"></lightning-spinner></div></template>
        <template lwc:elseif={error}><div class="cd-error" role="alert">{error}</div></template>
        <template lwc:else>
          <template lwc:if={hasResults}>
            <div class="cd-scroller">
              <table class="cd-table">
                <thead><tr><th scope="col">Component Name / Nº</th><th scope="col">Component Type</th><th scope="col">Source / Versão</th><th scope="col">Branch</th><th scope="col">Acessar</th></tr></thead>
                <tbody>
                  <template for:each={entries} for:item="entry">
                    <tr key={entry.id} class={entry.rowClass}>
                      <td><button type="button" class="cd-link" data-id={entry.id} onclick={handleSelect} title={entry.displayName}>{entry.displayName}</button><span class="cd-record-number">{entry.name}</span></td>
                      <td><span title={entry.typeLabel}>{entry.typeLabel}</span></td>
                      <td><span title={entry.displaySource}>{entry.displaySource}</span><span class="cd-record-number">v{entry.displayVersion}</span></td>
                      <td><template lwc:if={entry.branchId}><button type="button" class="cd-link" data-id={entry.branchId} onclick={handleOpenBranch} title={entry.branchName}>{entry.branchName}</button></template><template lwc:else><span title={entry.branchName}>{entry.branchName}</span></template></td>
                      <td><button type="button" class="cd-link" data-id={entry.id} onclick={handleOpenComponent}>Flosum</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="cd-pager"><span>Consulta paginada; não representa o inventário global.</span><lightning-button label="Carregar mais" onclick={handleNext} disabled={nextDisabled}></lightning-button></div>
          </template>
          <template lwc:elseif={noMatches}>
            <template lwc:if={emptyWithoutFilters}><p class="cd-empty">Nenhum componente acessível nesta consulta. Verifique permissões e compartilhamento de registros Flosum.</p></template>
            <template lwc:else><p class="cd-empty">Nenhum componente acessível corresponde aos filtros informados. Experimente limpar o nome ou o tipo.</p></template>
          </template>
          <template lwc:else><p class="cd-empty">Carregando o inventário acessível de componentes Flosum.</p></template>
        </template>
      </section>
      </template>
      <aside class="cd-panel cd-detail" aria-label="Detalhes do componente selecionado">
        <template lwc:if={detailLoading}><div class="cd-loading"><lightning-spinner size="small" alternative-text="Carregando histórico"></lightning-spinner></div></template>
        <template lwc:elseif={detailError}><div class="cd-error" role="alert">{detailError}</div></template>
        <template lwc:elseif={hasDetail}>
          <header class="cd-panel-head">
            <div class="cd-detail-heading"><h3 title={detailName}>{detailName}</h3><span class="cd-record-number">{detailNumber}</span></div>
            <div class="cd-detail-actions">
              <template lwc:if={detailExpanded}>
                <lightning-button label="Voltar à lista" icon-name="utility:back" onclick={handleToggleDetailFocus}></lightning-button>
              </template>
              <template lwc:else>
                <lightning-button label="Expandir detalhes" icon-name="utility:expand" onclick={handleToggleDetailFocus}></lightning-button>
              </template>
              <lightning-button-icon icon-name="utility:close" alternative-text="Fechar detalhe" onclick={handleClose}></lightning-button-icon>
            </div>
          </header>
          <div class="cd-detail-body">
            <section class="cd-facts" aria-label="Ficha do componente no Flosum">
              <h4 class="cd-section-title">Ficha do componente</h4>
              <dl class="cd-facts-grid">
                <div class="cd-fact"><dt>Component Type</dt><dd>{detailType}</dd></div>
                <div class="cd-fact"><dt>Versão registrada</dt><dd>{detailVersion}</dd></div>
                <div class="cd-fact"><dt>Source</dt><dd>{detailSource}</dd></div>
                <div class="cd-fact"><dt>Source Details</dt><dd>{detailSourceDetails}</dd></div>
                <div class="cd-fact"><dt>Branch vinculada</dt><dd>
                  <template lwc:if={detailBranchId}>
                    <button type="button" class="cd-link" data-id={detailBranchId}
                      title={detailBranchName} onclick={handleOpenBranch}>{detailBranchName}</button>
                  </template>
                  <template lwc:else>{detailBranchName}</template>
                </dd></div>
                <template lwc:if={detailChangedOn}>
                  <div class="cd-fact"><dt>Alterado em (UTC)</dt><dd>
                    <lightning-formatted-date-time value={detailChangedOn} time-zone="UTC"
                      day="2-digit" month="2-digit" year="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                  </dd></div>
                </template>
                <template lwc:if={detailCommittedOn}>
                  <div class="cd-fact"><dt>Commit registrado em (UTC)</dt><dd>
                    <lightning-formatted-date-time value={detailCommittedOn} time-zone="UTC"
                      day="2-digit" month="2-digit" year="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                  </dd></div>
                </template>
              </dl>
              <p class="cd-muted cd-facts-note">Dados registrados no Flosum. O vínculo com a Branch e a versão informada não comprovam implantação nem revisão de código.</p>
            </section>
            <section class="cd-history-section" aria-label="Históricos relacionados ao componente">
              <header class="cd-section-header">
                <h4 class="cd-section-title">Component Histories relacionados</h4>
                <span class="cd-history-count" aria-live="polite">{historyCountLabel}</span>
              </header>
              <template lwc:if={historyUnavailable}>
                <p class="cd-muted">A fonte histórica não está acessível ou não foi possível comprovar sua ligação.</p>
              </template>
              <template lwc:else>
                <template lwc:if={hasHistories}>
                  <ol class="cd-history-list" aria-label="Históricos acessíveis mais recentes">
                    <template for:each={historyRows} for:item="history">
                      <li key={history.id} class={history.rowClass}>
                        <div class="cd-history-info">
                          <span class="cd-history-sequence">Histórico {history.sequence}</span>
                          <lightning-formatted-date-time value={history.createdAt} time-zone="UTC"
                            day="2-digit" month="2-digit" year="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                        </div>
                        <div class="cd-history-actions">
                          <button type="button" class="cd-link" data-id={history.id} onclick={handleOpenHistory}>Abrir no Flosum</button>
                          <lightning-button label="Explorar ZIP" icon-name="utility:open_folder"
                            variant="neutral" data-id={history.id} onclick={handleExploreHistory}></lightning-button>
                        </div>
                      </li>
                    </template>
                  </ol>
                  <template lwc:if={hasHistoryMore}>
                    <p class="cd-muted">Mais registros existem além dos 20 históricos exibidos.</p>
                  </template>
                </template>
                <template lwc:else>
                  <p class="cd-muted">Nenhum histórico acessível neste vínculo consultado.</p>
                </template>
              </template>
            </section>
            <template lwc:if={archiveOpen}>
              <section class="cd-archive-panel" aria-label="Explorador ZIP do histórico">
                <div class="cd-archive-head">
                  <div><h4>Arquivos do histórico</h4><p class="cd-muted">{archiveName} · pré-visualização de texto, somente leitura</p></div>
                  <lightning-button-icon icon-name="utility:close" title="Fechar ZIP" alternative-text="Fechar explorador" onclick={handleArchiveClose}></lightning-button-icon>
                </div>
                <template lwc:if={archiveLoading}><div class="cd-loading"><lightning-spinner size="small" alternative-text="Abrindo arquivo ZIP"></lightning-spinner></div></template>
                <template lwc:elseif={archiveError}><div class="cd-error" role="alert">{archiveError}</div></template>
                <template lwc:elseif={hasArchiveEntries}>
                  <div class="cd-archive-toolbar">
                    <lightning-input type="search" label="Localizar arquivo no ZIP" placeholder="Filtrar arquivos pelo caminho…" value={archiveFilter} onchange={handleArchiveFilterChange}></lightning-input>
                    <span class="cd-muted" aria-live="polite">{archiveMatchCount} de {archiveTotalCount} arquivos</span>
                  </div>
                  <template lwc:if={hasMatchingArchiveEntries}>
                  <div class="cd-archive-grid">
                    <div class="cd-archive-files" role="group" aria-label="Arquivos no ZIP">
                      <template for:each={archiveEntries} for:item="entry">
                        <button key={entry.path} type="button" class={entry.rowClass}
                          data-path={entry.path} onclick={handleSelectArchiveFile}
                          disabled={entry.disabled} title={entry.path}>{entry.path}</button>
                      </template>
                    </div>
                    <div class="cd-archive-preview">
                      <template lwc:if={hasArchiveText}>
                        <p class="cd-archive-filename">{archiveFileName}</p>
                        <pre class="cd-archive-code"><code>{archiveContent}</code></pre>
                      </template>
                      <template lwc:else>
                        <p class="cd-empty">Selecione um arquivo de texto para ler seu conteúdo. Binários e arquivos grandes ficam bloqueados.</p>
                      </template>
                    </div>
                  </div>
                  </template>
                  <template lwc:else><p class="cd-empty" role="status">Nenhum arquivo corresponde ao filtro informado.</p></template>
                </template>
                <template lwc:else><p class="cd-empty">O ZIP não contém arquivos disponíveis.</p></template>
                <p class="cd-muted cd-archive-footnote">Pré-visualização limitada a 64 KiB por arquivo, ZIP de até 1 MiB e 200 entradas. Nenhum conteúdo é executado ou alterado.</p>
              </section>
            </template>
            <div class="cd-caution" role="note">Versões, commits, deploys e Diff ainda não estão correlacionados a este componente. Não exibir histórico de deploy sem evidência direta.</div>
          </div>
        </template>
        <template lwc:else><p class="cd-empty">Selecione uma ocorrência para visualizar a Branch e os históricos diretamente relacionados.</p></template>
      </aside>
    </div>
  </div>
</template>
