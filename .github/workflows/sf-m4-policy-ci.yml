# No Salesforce access, JWT secrets, deployments or production triggers.
name: M4 Policy Checks

on:
  pull_request:
    paths:
      - '.github/workflows/sf-universal-m4.yml'
      - '.github/workflows/sf-m5-chatops-plan.yml'
      - '.github/workflows/sf-m4-policy-ci.yml'
      - 'scripts/ci/sf-general-deploy.sh'
      - 'scripts/ci/sf-deploy-safe-diagnostic.py'
      - 'scripts/ci/sf-deploy-policy.py'
      - 'scripts/ci/sf-m5-chatops-intent.py'
      - 'scripts/ci/sf-kit-read.sh'
      - 'scripts/ci/sf-kit-read-report.py'
      - 'scripts/ci/sf-kit-install.py'
      - 'templates/salesforce-devops-kit/**'
      - 'config/salesforce-devops/catalog.json'
      - 'manifest/**'
      - 'tests/test_sf_*'
      - 'force-app/main/default/classes/ClonePipelineController.cls'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check bash syntax
        run: bash -n scripts/ci/sf-general-deploy.sh scripts/ci/sf-kit-read.sh
      - name: Check Python syntax
        run: python3 -m py_compile scripts/ci/sf-deploy-policy.py scripts/ci/sf-deploy-safe-diagnostic.py tests/test_sf_deploy_policy.py tests/test_sf_m42_contract.py tests/test_sf_m42_diagnostics.py tests/test_sf_clone_pipeline_apex_integrity.py scripts/ci/sf-m5-chatops-intent.py tests/test_sf_m5_chatops_intent.py tests/test_sf_m53_detailed_report.py scripts/ci/sf-kit-read-report.py tests/test_sf_kit_read.py
      - name: Test package policy and M4.2 workflow contract
        run: python3 -m unittest discover -s tests -p 'test_sf_*.py' -v
