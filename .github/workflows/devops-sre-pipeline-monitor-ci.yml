name: DevOps SRE Pipeline Monitor CI

on:
  pull_request:
    paths:
      - '.github/workflows/devops-sre-pipeline-monitor-ci.yml'
      - 'force-app/main/default/lwc/devSrePipelineMonitor/**'
      - 'force-app/main/default/lwc/devSreBranchMonitor/**'
      - 'force-app/main/default/lwc/devSreComponentDescriber/**'
      - 'force-app/main/default/classes/DevSreComponentDescriber*'
      - 'force-app/main/default/classes/DevSreHistoryArchiveReader*'
      - 'force-app/main/default/classes/DevSreBranchMonitor*'
      - 'force-app/main/default/classes/DevSrePipelineMonitorController*'
      - 'manifest/sf-devops-sre-pipeline-monitor.xml'
      - '.github/workflows/sf-devsrefeat-diagnostics.yml'
      - 'scripts/ci/sf-flosum-schema-inventory.py'
      - 'tests/test_sf_fl_osum_schema_inventory.py'
      - 'scripts/ci/sf-flosum-branch-inspect.py'
      - 'tests/test_sf_fl_osum_branch_inspect.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lwc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Flosum schema inventory security and parsing
        run: python3 -m unittest discover -s tests -p 'test_sf_fl_osum_schema_inventory.py' -v
      - name: Verify bounded Branch and Metadata Log inspector
        run: python3 -m unittest discover -s tests -p 'test_sf_fl_osum_branch_inspect.py' -v
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint Pipeline Monitor
        run: npx eslint force-app/main/default/lwc/devSrePipelineMonitor/devSrePipelineMonitor.js
      - name: ESLint Branch Monitor
        run: npx eslint force-app/main/default/lwc/devSreBranchMonitor/devSreBranchMonitor.js
      - name: ESLint Component Describer
        run: npx eslint force-app/main/default/lwc/devSreComponentDescriber/devSreComponentDescriber.js
      - name: Jest Component Describer
        run: npm run test:unit -- -- --runInBand --runTestsByPath force-app/main/default/lwc/devSreComponentDescriber/__tests__/devSreComponentDescriber.test.js
      - name: Jest Branch Monitor
        run: npm run test:unit -- -- --runInBand --runTestsByPath force-app/main/default/lwc/devSreBranchMonitor/__tests__/devSreBranchMonitor.test.js
      - name: Jest Pipeline Monitor
        run: npm run test:unit -- -- --runInBand --runTestsByPath force-app/main/default/lwc/devSrePipelineMonitor/__tests__/devSrePipelineMonitor.test.js
