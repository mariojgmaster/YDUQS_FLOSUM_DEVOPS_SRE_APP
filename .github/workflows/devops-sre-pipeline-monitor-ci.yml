name: DevOps SRE Pipeline Monitor CI

on:
  pull_request:
    paths:
      - '.github/workflows/devops-sre-pipeline-monitor-ci.yml'
      - 'force-app/main/default/lwc/devSrePipelineMonitor/**'
      - 'force-app/main/default/classes/DevSrePipelineMonitorController*'
      - 'manifest/sf-devops-sre-pipeline-monitor.xml'
      - '.github/workflows/sf-devsrefeat-diagnostics.yml'
      - 'scripts/ci/sf-flosum-schema-inventory.py'
      - 'tests/test_sf_fl_osum_schema_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lwc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Flosum schema inventory security and parsing
        run: python3 -m unittest discover -s tests -p 'test_sf_fl_osum_schema_inventory.py' -v
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint Pipeline Monitor
        run: npx eslint force-app/main/default/lwc/devSrePipelineMonitor/devSrePipelineMonitor.js
      - name: Jest Pipeline Monitor
        run: npm run test:unit -- -- --runInBand --runTestsByPath force-app/main/default/lwc/devSrePipelineMonitor/__tests__/devSrePipelineMonitor.test.js
