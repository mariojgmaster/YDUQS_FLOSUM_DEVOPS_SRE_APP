# M4.2 — sandbox only. No baseline/preview gate; validate on Salesforce before any write.
name: Salesforce DevOps - M4 Universal

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan = Salesforce dry-run + Apex tests, no write; deploy = real write after dry-run'
        required: true
        type: choice
        options: [plan, deploy]
      target:
        description: 'Registered Salesforce sandbox'
        required: true
        type: choice
        options: [DevSreFeat]
      package_id:
        description: 'Registered and reviewed metadata package'
        required: true
        type: choice
        options: [security-apex, clone-pipeline-lwc, clone-pipeline-apex]
      confirmation:
        description: 'Blank for plan; for deploy type exactly: DEPLOY DevSreFeat package_id'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: sf-devsrefeat-read
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.actor == github.repository_owner && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    outputs:
      github_environment: ${{ steps.registry.outputs.github_environment }}
      instance_url: ${{ steps.registry.outputs.instance_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate reviewed package and M4.2 execution contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/sf-general-deploy.sh
          python3 -m unittest discover -s tests -p 'test_sf_*.py' -v
      - name: Set up Node.js for registered LWC unit tests
        if: ${{ inputs.package_id == 'clone-pipeline-lwc' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned LWC test dependencies
        if: ${{ inputs.package_id == 'clone-pipeline-lwc' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run clonePipelineAction Jest gate before Salesforce access
        if: ${{ inputs.package_id == 'clone-pipeline-lwc' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit -- --runInBand --runTestsByPath force-app/main/default/lwc/clonePipelineAction/__tests__/clonePipelineAction.test.js
          echo "SDOA_LWC_JEST_PASSED: LWC regression tests passed before Salesforce access."
      - name: Resolve reviewed target/package catalog
        id: registry
        env:
          TARGET: ${{ inputs.target }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: python3 scripts/ci/sf-deploy-policy.py resolve --target "$TARGET" --package "$PACKAGE_ID" --output-file "$GITHUB_OUTPUT"

  execute:
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    name: Validate in Salesforce and optionally deploy
    runs-on: ubuntu-latest
    timeout-minutes: 140
    # Always reuse the existing reviewed GitHub Environment (ECA/JWT secrets).
    environment:
      name: ${{ needs.resolve.outputs.github_environment }}
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
      SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
      EXPECTED_INSTANCE_URL: ${{ needs.resolve.outputs.instance_url }}
      GITHUB_ENVIRONMENT_NAME: ${{ needs.resolve.outputs.github_environment }}
      OPERATION: ${{ inputs.operation }}
      TARGET: ${{ inputs.target }}
      PACKAGE_ID: ${{ inputs.package_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout exact workflow revision (immutable SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Salesforce CLI runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Validate on Salesforce and optionally deploy
        shell: bash
        run: bash scripts/ci/sf-general-deploy.sh
      - name: Upload sanitized Salesforce report (NO RAW JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdoa-safe-report-${{ github.run_id }}
          path: ${{ runner.temp }}/sdoa-safe-report.json
          if-no-files-found: ignore
          retention-days: 7
