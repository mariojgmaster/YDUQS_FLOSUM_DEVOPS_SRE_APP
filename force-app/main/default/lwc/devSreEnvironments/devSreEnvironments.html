<template>
  <section class="ds-page environment-page" aria-label="Ambientes">
    <header class="ds-header environment-hero">
      <div class="ds-heading">
        <lightning-icon icon-name="standard:environment_hub" size="medium" alternative-text=""></lightning-icon>
        <div>
          <p class="environment-eyebrow">AMBIENTES</p>
          <h2 class="ds-title">Ambientes</h2>
          <p class="ds-subtitle">Defina o uso de cada organização Flosum nas análises.</p>
        </div>
      </div>
      <div class="ds-actions">
        <lightning-button label="Atualizar lista" icon-name="utility:refresh" onclick={handleRefresh} disabled={busy}></lightning-button>
        <template lwc:if={canManage}>
          <lightning-button data-create variant="brand" label="Classificar organização" icon-name="utility:add" onclick={handleNew} disabled={busy}></lightning-button>
        </template>
      </div>
    </header>
    <div class="ds-section ds-stack">
      <template lwc:if={error}><p class="ds-error" role="alert">{error}</p></template>
      <template lwc:if={organizationError}><p class="ds-error" role="alert">{organizationError}</p></template>
      <template lwc:if={notice}><p class="ds-banner" role="status">{notice}</p></template>
      <div class={layoutClass}>
        <section class="environment-table-panel" aria-label="Classificações de organizações">
          <div class="environment-toolbar">
            <div class="environment-tabs" role="group" aria-label="Visão das classificações">
              <lightning-button label="Classificações atuais" variant={currentVariant} onclick={handleCurrent}></lightning-button>
              <lightning-button label="Histórico" variant={historyVariant} onclick={handleHistory}></lightning-button>
            </div>
            <lightning-input name="organizationQuery" variant="label-hidden" type="search" label="Pesquisar organização" placeholder="Pesquisar organização..." value={organizationQuery} maxlength="80" onchange={handleChange}></lightning-input>
          </div>
          <template lwc:if={isHistory}>
            <div class="environment-history-filters">
              <lightning-combobox name="view" label="Período do histórico" value={view} options={historyOptions} onchange={handleChange} disabled={busy}></lightning-combobox>
              <lightning-combobox name="organizationFilter" label="Organização" value={organizationFilter} options={filterOptions} onchange={handleChange} disabled={busy}></lightning-combobox>
              <lightning-button label="Todas as organizações" onclick={handleClearHistoryFilter}></lightning-button>
            </div>
          </template>
          <template lwc:if={busy}>
            <div class="ds-loading"><lightning-spinner size="small" alternative-text="Atualizando ambientes"></lightning-spinner></div>
          </template>
          <template lwc:elseif={hasVisibleRows}>
            <div class="ds-table">
              <lightning-datatable data-name="environmentMappings" key-field="id" data={visibleRows} columns={columns} onrowaction={handleRowAction} hide-checkbox-column></lightning-datatable>
            </div>
          </template>
          <template lwc:elseif={showEmpty}>
            <div class="ds-empty" role="status"><h3>{emptyTitle}</h3><p>{emptyDescription}</p></div>
          </template>
          <div class="environment-table-footer">
            <p class="ds-help" role="status">{statusLabel}</p>
            <p class="ds-help">Sem data final, a classificação continua válida.</p>
          </div>
          <lightning-accordion class="environment-help">
            <lightning-accordion-section name="dates" label="Por que informar desde quando?">
              <p>Se uma organização era UAT até junho e passou a PROD em julho, as entregas de junho devem continuar identificadas como UAT.</p>
              <p class="ds-help">O início é inclusivo e o término exclusivo: uma nova classificação pode começar no mesmo instante da anterior. Datas na lista em UTC; no formulário, o fuso é o do seu perfil Salesforce.</p>
            </lightning-accordion-section>
            <lightning-accordion-section name="find" label="Localizar outra organização para classificar">
              <div class="ds-filters">
                <lightning-input name="organizationSearch" type="search" label="Nome da organização" value={organizationSearch} maxlength="80" onchange={handleChange}></lightning-input>
                <lightning-button label="Buscar organizações" onclick={handleSearchOrganizations} disabled={organizationsLoading}></lightning-button>
              </div>
              <template lwc:if={organizationsHaveMore}><p class="ds-help" role="status">Mais de 50 organizações encontradas. Refine a busca.</p></template>
            </lightning-accordion-section>
          </lightning-accordion>
        </section>
        <template lwc:if={showEditor}>
          <aside class="environment-editor" aria-label="Classificar organização">
            <div class="environment-panel-heading">
              <div class="ds-heading"><lightning-icon icon-name="utility:description" size="small" alternative-text=""></lightning-icon><h3>{formTitle}</h3></div>
              <lightning-button-icon icon-name="utility:close" alternative-text="Fechar painel sem salvar" title="Fechar painel" onclick={handleCancel} disabled={saving}></lightning-button-icon>
            </div>
            <div class="environment-form">
              <p class="ds-help">{formHelp}</p>
              <template lwc:if={formError}><p class="ds-error" role="alert">{formError}</p></template>
              <lightning-combobox data-form data-focus name="organizationId" label="Organização Flosum" value={organizationId} options={organizations} required disabled={identityDisabled} onchange={handleChange}></lightning-combobox>
              <lightning-combobox data-form name="environmentClass" label="Uso da organização" value={environmentClass} options={environmentOptions} required disabled={identityDisabled} onchange={handleChange}></lightning-combobox>
              <lightning-input data-form name="validFrom" type="datetime" label="Esta classificação vale desde" value={validFrom} required disabled={identityDisabled} onchange={handleChange} field-level-help="Use o início real para classificar corretamente entregas antigas."></lightning-input>
              <p class="ds-help">Informe o início do uso real. Horário no fuso do perfil Salesforce.</p>
              <lightning-input name="hasEnd" type="checkbox" label="Definir data final" checked={hasEnd} disabled={endToggleDisabled} onchange={handleChange}></lightning-input>
              <template lwc:if={hasEnd}>
                <lightning-input data-form data-end-focus name="validTo" type="datetime" label="Esta classificação vale até" value={validTo} required disabled={saving} onchange={handleChange} field-level-help="Este instante não está incluído no período."></lightning-input>
              </template>
              <lightning-textarea data-form data-reason-focus name="reason" label="Motivo da classificação" placeholder="Descreva o motivo desta configuração" maxlength="255" value={reason} required disabled={saving} onchange={handleChange}></lightning-textarea>
              <div class="environment-actions">
                <lightning-button label="Cancelar" onclick={handleCancel} disabled={saving}></lightning-button>
                <lightning-button variant="brand" label="Salvar classificação" onclick={handleSave} disabled={busy}></lightning-button>
              </div>
              <p class="ds-banner"><lightning-icon icon-name="utility:info" size="xx-small" alternative-text="Informação"></lightning-icon>
                A classificação é aplicada aos deployments pela data de conclusão.</p>
            </div>
          </aside>
        </template>
      </div>
      <template lwc:if={readOnly}><p class="ds-help">Somente leitura. Para classificar organizações, solicite permissão de gestão de ambientes ao administrador.</p></template>
    </div>
  </section>
</template>
