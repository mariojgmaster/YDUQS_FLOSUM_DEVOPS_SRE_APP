# Two owner-only intents: workflow_dispatch or exact owner-authored Issue.
# Both paths are SANDBOX DRY-RUN ONLY; no deployment persists, never from PRs.
name: Salesforce DevSreFeat - Incident Validation

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: sf-devsrefeat-read
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/master' && github.actor == github.repository_owner && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner && github.event.sender.login == github.repository_owner && github.event.issue.title == 'SDOA VALIDATE DevSreFeat incident-intake')) }}
    name: Dry-run completo dos Incidentes na DevSreFeat
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: sf-devsrefeat-read
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
      SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      EXPECTED_REF: ${{ github.ref }}
      EXPECTED_ACTOR: ${{ github.actor }}
      EXPECTED_OWNER: ${{ github.repository_owner }}
      EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout da master revisada no SHA exato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verificar intenção ChatOps exata antes de qualquer credencial
        if: github.event_name == 'issues'
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.repository }}
        run: python3 scripts/ci/sf-incident-chatops-intent.py --event "$GITHUB_EVENT_PATH" --owner "$REPO_OWNER" --repository "$REPO_NAME"
      - name: Verificar escopo e controles estaticos
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify-incident-metadata.py
          python3 scripts/ci/verify-rm-review.py
          python3 scripts/ci/verify-incident-sandbox-scope.py
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar testes LWC antes de autenticar na org
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx eslint force-app/main/default/lwc/devSreIncidentIntake/devSreIncidentIntake.js
          npm run test:unit -- -- --runInBand --runTestsByPath force-app/main/default/lwc/devSreIncidentIntake/__tests__/devSreIncidentIntake.test.js force-app/main/default/lwc/devSreIncidentIntake/__tests__/devSreIncidentIntakeRm.test.js
      - name: Instalar CLI Salesforce
        run: npm install --global @salesforce/cli
      - name: Dry-run Metadata API DevSreFeat
        shell: bash
        run: bash scripts/ci/sf-incident-sandbox-validate.sh
