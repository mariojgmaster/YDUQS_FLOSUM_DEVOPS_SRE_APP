# M4 pilot: explicit and auditable Salesforce deployment on DevSreFeat only.
# Intentionally reuses the EXISTING GitHub Environment sf-devsrefeat-read.
# No deployment approval gate; intention is proven by manual dispatch + SHA + phrase.
# NEVER enable push, PR, schedule, issue_comment or workflow_run triggers here.
name: Salesforce DevSreFeat - Deploy Explicito M4

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Cole o SHA completo (40 caracteres) do commit da master que deseja implantar"
        required: true
        type: string
      confirmation:
        description: "Digite exatamente DEPLOY DevSreFeat para autorizar o deployment REAL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sf-devsrefeat-read
  cancel-in-progress: false

jobs:
  deploy:
    # Pilot repository belongs to an individual. Only its owner can initiate deploys.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.actor == github.repository_owner }}
    name: Validar e implantar explicitamente na DevSreFeat
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same environment already used by SOQL, Apex testing and Metadata M3.
    environment: sf-devsrefeat-read
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
      SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      TARGET_SHA: ${{ github.sha }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      INVOKING_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify explicit deployment intent and metadata allowlist
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] || { echo "::error title=M4_MANUAL_ONLY::Deploy must be dispatched manually."; exit 1; }
          [[ "$REF_NAME" == "master" ]] || { echo "::error title=M4_BRANCH_DENIED::Only master is deployable."; exit 1; }
          [[ "$INVOKING_ACTOR" == "$GITHUB_OWNER" ]] || { echo "::error title=M4_ACTOR_DENIED::Only the pilot repository owner may deploy."; exit 1; }
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error title=M4_RERUN_DENIED::Re-runs of a real deployment workflow are forbidden; make a fresh explicit request."; exit 1; }
          [[ "$CONFIRMATION" == "DEPLOY DevSreFeat" ]] || { echo "::error title=M4_NO_CONFIRMATION::Type the exact deployment confirmation phrase."; exit 1; }
          [[ "$REQUESTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "::error title=M4_INVALID_SHA::Provide a full 40-character commit SHA."; exit 1; }
          [[ "${REQUESTED_SHA,,}" == "${TARGET_SHA,,}" ]] || { echo "::error title=M4_SHA_MISMATCH::The manually supplied SHA does not match the checked-out master revision."; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "::error title=M4_CHECKOUT_MISMATCH::Unexpected repository commit."; exit 1; }
          [[ "$SF_INSTANCE_URL" == "https://yduqs--devsrefeat.sandbox.my.salesforce.com" ]] || { echo "::error title=M4_TARGET_DENIED::Only DevSreFeat sandbox is permitted."; exit 1; }
          for name in SF_CLIENT_ID SF_USERNAME SF_JWT_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error title=M4_SECRET_MISSING::Missing GitHub Environment secret."; exit 1; }
          done
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          p = "manifest/sf-devsrefeat-m3.xml"
          try:
              root = ET.parse(p).getroot()
              ns = {"m": "http://soap.sforce.com/2006/04/metadata"}
              typ = root.findall("m:types", ns)
              valid = (len(typ) == 1 and
                  typ[0].findtext("m:name", namespaces=ns) == "ApexClass" and
                  [e.text for e in typ[0].findall("m:members", ns)] ==
                  ["CompareSecurityCode", "CompareSecurityCodeTest"])
              if root.findtext("m:version", namespaces=ns) != "67.0":
                  valid = False
              if not valid:
                  raise ValueError("Manifest is not the expected allowlist")
          except Exception:
              print("::error title=M4_MANIFEST_DENIED::The M4 pilot allows only two reviewed Apex classes.")
              sys.exit(1)
          print("M4_MANIFEST_VERIFIED: exact allowlist of two Apex classes.")
          PY
          test -f force-app/main/default/classes/CompareSecurityCode.cls
          test -f force-app/main/default/classes/CompareSecurityCodeTest.cls
          test -f force-app/main/default/classes/CompareSecurityCode.cls-meta.xml
          test -f force-app/main/default/classes/CompareSecurityCodeTest.cls-meta.xml
          echo "M4_INTENT_VERIFIED: manual dispatch, owner, master, SHA, target and component scope."

      - name: Set up Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: JWT login, dry-run and explicitly confirmed deployment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/m4-devsrefeat-jwt.key"
          AUTH="$RUNNER_TEMP/m4-devsrefeat-auth.json"
          DRY="$RUNNER_TEMP/m4-devsrefeat-dryrun.json"
          REAL="$RUNNER_TEMP/m4-devsrefeat-deploy.json"
          ERR="$RUNNER_TEMP/m4-devsrefeat-cli.err"
          PREVIEW="$RUNNER_TEMP/m4-devsrefeat-preview.json"
          PREVIEW_ERR="$RUNNER_TEMP/m4-devsrefeat-preview.err"
          COMPARE_OUT="$RUNNER_TEMP/m4-devsrefeat-compare.out"
          COMPARE_ERR="$RUNNER_TEMP/m4-devsrefeat-compare.err"
          cleanup() { rm -f "$KEY" "$AUTH" "$DRY" "$REAL" "$ERR" "$PREVIEW" "$PREVIEW_ERR" "$COMPARE_OUT" "$COMPARE_ERR"; }
          trap cleanup EXIT
          printf '%s' "$SF_JWT_KEY" > "$KEY"
          if ! openssl pkey -in "$KEY" -noout -passin pass: >/dev/null 2>&1; then
            echo "::error title=M4_KEY_INVALID::Invalid PEM private key in the existing Environment."
            exit 1
          fi
          if ! sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --username "$SF_USERNAME" \
            --jwt-key-file "$KEY" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias devsrefeat-m4 \
            --json > "$AUTH" 2> "$ERR"; then
            echo "::error title=M4_AUTH_FAILED::JWT authentication failed. Review Salesforce Login History privately."
            exit 1
          fi
          echo "M4_AUTH_PASSED: Salesforce JWT authentication completed."

          # Never print Salesforce's raw JSON or stderr in this public repository.
          # Only fixed diagnostic categories, numeric exit codes and JSON types.
          classify_cli_error() {
            if grep -Eiq 'SourceConflictError|ConflictsError|error\.Conflicts|changes in the org that conflict' "$@"; then
              echo "SOURCE_CONFLICT"
            elif grep -Eiq 'nothingToDeploy|No local changes to deploy' "$@"; then
              echo "NOTHING_TO_DEPLOY"
            elif grep -Eiq 'JwtGrantError|ENOENT.*(jwt|pem|\\.key)|no such file or directory.*(jwt|pem|\\.key)' "$@"; then
              echo "JWT_KEY_UNAVAILABLE"
            elif grep -Eiq 'INVALID_SESSION_ID|invalid_grant|expired access token' "$@"; then
              echo "SESSION_OR_AUTH"
            elif grep -Eiq 'INSUFFICIENT_ACCESS|INVALID_PERMISSION|insufficient privileges|not authorized|permission denied' "$@"; then
              echo "PERMISSION"
            elif grep -Eiq 'ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND|rate limit|REQUEST_LIMIT_EXCEEDED|timed out' "$@"; then
              echo "NETWORK_OR_LIMIT"
            elif grep -Eiq 'unknown flag|invalid option|Unexpected argument|unknown option' "$@"; then
              echo "CLI_ARGUMENT"
            else
              echo "UNCLASSIFIED"
            fi
          }
          report_deploy_json() {
            local phase="$1" file="$2"
            if ! jq -e 'type == "object"' "$file" >/dev/null 2>&1; then
              echo "M4_${phase}_JSON: unavailable_or_invalid"
              return
            fi
            jq -r --arg phase "$phase" '
              def number_or_unknown:
                if type=="number" and .>=0 and .<=10000000 then tostring else "unknown" end;
              def status_category:
                if .=="Succeeded" or .=="Failed" or .=="InProgress" or .=="Pending" or .=="Canceled" then . else "other_or_missing" end;
              "M4_\($phase)_RESPONSE: status=" +
                (if .status==0 then "0" elif (.status|type)=="number" then "nonzero" else "missing" end) +
                " success=" + (if .result.success == true then "true" elif .result.success == false then "false" else "missing" end) +
                " result_status=" + (.result.status | status_category) +
                " component_errors=" + (.result.numberComponentErrors | number_or_unknown) +
                " test_errors=" + (.result.numberTestErrors | number_or_unknown) +
                " tests_completed=" + (.result.numberTestsCompleted | number_or_unknown)
            ' "$file" 2>/dev/null || echo "M4_${phase}_JSON: unexpected_schema"
          }
          cli_version="$(sf --version 2>/dev/null | grep -Eo '@salesforce/cli/[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [[ -n "$cli_version" ]]; then
            echo "M4_CLI_VERSION: $cli_version"
          fi

          # Fresh Metadata API ZIP retrieve + four-file comparison, using the
          # already homologated M3 routine. The existing pilot may override
          # source-tracking CONFLICTS only if the org is byte-equivalent to Git.
          # If the org differs, fail closed: legitimate future updates require
          # a separate explicit and reviewed conflict-resolution policy.
          if ! SF_M3_REUSE_M4_AUTH=1 OPERATION=compare bash scripts/ci/sf-devsrefeat-m3.sh > "$COMPARE_OUT" 2> "$COMPARE_ERR"; then
            echo "::error title=M4_ORG_DRIFT_OR_RETRIEVE_FAILURE::Could not verify that the org metadata equals the reviewed GitHub commit. No real deployment attempted."
            exit 1
          fi
          if ! grep -Fxq "M3_COMPARE_SUMMARY: same=4 different=0 missing=0" "$COMPARE_OUT"; then
            echo "::error title=M4_METADATA_NOT_IDENTICAL::The four approved metadata files are not verified as identical. No real deployment attempted."
            exit 1
          fi
          echo "M4_METADATA_IDENTICAL: four approved Apex/metadata files match the org; no real metadata drift."
          echo "M4_SINGLE_JWT_SESSION: comparison reused the parent M4 session; no second JWT login."

          # Preview immediately before dry-run. Restrict to the same manifest.
          preview_exit=0
          sf project deploy preview \
            --manifest manifest/sf-devsrefeat-m3.xml \
            --target-org devsrefeat-m4 \
            --json > "$PREVIEW" 2> "$PREVIEW_ERR" || preview_exit=$?
          echo "M4_PREVIEW_CLI_EXIT: $preview_exit"
          if ! jq -e 'type == "object"' "$PREVIEW" >/dev/null 2>&1; then
            echo "::error title=M4_PREVIEW_INVALID_JSON::CLI response was empty, invalid JSON or not an object. No real deployment attempted."
            exit 1
          fi
          # Field types are safe to disclose, unlike field values, component
          # names, request IDs, usernames or Salesforce stack traces.
          read -r root_status result_type deploy_type conflict_type delete_type ignored_type < <(jq -r '
            [
              (if .status==0 then "0" elif (.status|type)=="number" then "nonzero" else "missing" end),
              (.result | type),
              ((if (.result | type) == "object" then .result.toDeploy else null end) | type),
              ((if (.result | type) == "object" then .result.conflicts else null end) | type),
              ((if (.result | type) == "object" then .result.toDelete else null end) | type),
              ((if (.result | type) == "object" then .result.ignored else null end) | type)
            ] | @tsv' "$PREVIEW")
          echo "M4_PREVIEW_JSON_SHAPE: status=$root_status result=$result_type toDeploy=$deploy_type conflicts=$conflict_type toDelete=$delete_type ignored=$ignored_type"
          if [[ "$preview_exit" -ne 0 ]]; then
            echo "::error title=M4_PREVIEW_CLI_ERROR::CLI error category=$(classify_cli_error "$PREVIEW" "$PREVIEW_ERR"). No real deployment attempted."
            exit 1
          fi
          if [[ "$root_status" != "0" ]]; then
            echo "::error title=M4_PREVIEW_STATUS_ERROR::Salesforce CLI returned a non-success status. No real deployment attempted."
            exit 1
          fi
          if [[ "$result_type" != "object" || "$deploy_type" != "array" || "$conflict_type" != "array" || "$delete_type" != "array" || "$ignored_type" != "array" ]]; then
            echo "::error title=M4_PREVIEW_SCHEMA_MISMATCH::The structured preview fields did not match the supported CLI result schema. No real deployment attempted."
            exit 1
          fi
          read -r TO_DEPLOY CONFLICTS TO_DELETE IGNORED < <(jq -r '[(.result.toDeploy | length), (.result.conflicts | length), (.result.toDelete | length), (.result.ignored | length)] | @tsv' "$PREVIEW")
          echo "M4_PREVIEW_SUMMARY: toDeploy=$TO_DEPLOY conflicts=$CONFLICTS toDelete=$TO_DELETE ignored=$IGNORED"
          if (( TO_DELETE > 0 || IGNORED > 0 )); then
            echo "::error title=M4_PREVIEW_UNSAFE::Unexpected deletion or ignored components. No real deployment attempted."
            exit 1
          fi
          if (( TO_DEPLOY == 0 && CONFLICTS == 0 )); then
            echo "M4_NOOP_ALREADY_SYNCED: no components require deployment. No real deployment attempted."
            exit 0
          fi
          # The only permitted conflict override is for an identical reviewed
          # two-class sandbox package, and only after explicit user intent.
          VERIFIED_CONFLICT_ARGS=()
          if (( CONFLICTS > 0 )); then
            VERIFIED_CONFLICT_ARGS+=(--ignore-conflicts)
            echo "M4_TRACKING_ONLY_OVERRIDE: org metadata matches Git; ignoring source-tracking conflict for the two allowlisted Apex classes only."
          fi

          # Dry-run uses the SAME checked-out source, target, manifest and Apex test.
          dry_exit=0
          sf project deploy start \
            --dry-run \
            --manifest manifest/sf-devsrefeat-m3.xml \
            --test-level RunSpecifiedTests \
            --tests CompareSecurityCodeTest \
            --target-org devsrefeat-m4 \
            --wait 60 \
            --json > "$DRY" 2> "$ERR" || dry_exit=$?
          echo "M4_DRY_RUN_CLI_EXIT: $dry_exit"
          report_deploy_json "DRY_RUN" "$DRY"
          if [[ "$dry_exit" -ne 0 ]]; then
            echo "::error title=M4_DRY_RUN_FAILED::CLI error category=$(classify_cli_error "$DRY" "$ERR"). No real deployment attempted."
            exit 1
          fi
          if ! jq -e '.status == 0 and .result.success == true and (.result.done == true or .result.status == "Succeeded")' "$DRY" >/dev/null 2>&1; then
            echo "::error title=M4_DRY_RUN_INCOMPLETE::Dry-run not conclusively successful. No real deploy attempted."
            exit 1
          fi
          echo "M4_DRY_RUN_PASSED: selected Apex metadata validated; no changes persisted."

          # Recheck equality AFTER the dry-run to narrow the interval between
          # the org read and the only possible ignore-conflicts write.
          if (( CONFLICTS > 0 )); then
            if ! SF_M3_REUSE_M4_AUTH=1 OPERATION=compare bash scripts/ci/sf-devsrefeat-m3.sh > "$COMPARE_OUT" 2> "$COMPARE_ERR" || \
               ! grep -Fxq "M3_COMPARE_SUMMARY: same=4 different=0 missing=0" "$COMPARE_OUT"; then
              echo "::error title=M4_ORG_CHANGED_AFTER_VALIDATION::Org metadata changed or could not be rechecked after dry-run. No real deployment attempted."
              exit 1
            fi
            echo "M4_METADATA_RECHECK_PASSED: org metadata still matches approved GitHub files."
          fi

          # One last fail-closed guard immediately before the intentional write.
          [[ "$CONFIRMATION" == "DEPLOY DevSreFeat" && "${REQUESTED_SHA,,}" == "${TARGET_SHA,,}" && "$RUN_ATTEMPT" == "1" ]] || {
            echo "::error title=M4_WRITE_NOT_AUTHORIZED::Explicit deployment guards failed."
            exit 1
          }
          echo "M4_REAL_DEPLOY_STARTING: intentional deployment to DevSreFeat."
          deploy_exit=0
          sf project deploy start \
            --manifest manifest/sf-devsrefeat-m3.xml \
            --test-level RunSpecifiedTests \
            --tests CompareSecurityCodeTest \
            --target-org devsrefeat-m4 \
            "${VERIFIED_CONFLICT_ARGS[@]}" \
            --wait 60 \
            --json > "$REAL" 2> "$ERR" || deploy_exit=$?
          echo "M4_REAL_DEPLOY_CLI_EXIT: $deploy_exit"
          report_deploy_json "REAL_DEPLOY" "$REAL"
          if [[ "$deploy_exit" -ne 0 ]]; then
            echo "::error title=M4_DEPLOY_REPORTED_FAILURE::CLI error category=$(classify_cli_error "$REAL" "$ERR"). Verify Deployment Status before retrying."
            exit 1
          fi
          if ! jq -e '.status == 0 and .result.success == true and (.result.done == true or .result.status == "Succeeded")' "$REAL" >/dev/null 2>&1; then
            echo "::error title=M4_DEPLOY_UNCONFIRMED::Real deploy may still be running; verify Salesforce Deployment Status. Never retry blindly."
            exit 1
          fi
          echo "M4_REAL_DEPLOY_SUCCEEDED: Salesforce confirmed the authorized deployment."
