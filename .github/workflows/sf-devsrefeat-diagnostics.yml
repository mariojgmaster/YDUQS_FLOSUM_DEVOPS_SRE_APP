# Piloto DevSreFeat: nenhum deploy, nenhuma consulta arbitraria.
# Antes de executar: criar o Environment sf-devsrefeat-read com secrets/variables.
# O repositorio e PUBLICO: NUNCA imprimir classes/IDs/tokens em logs ou artifacts.
name: Salesforce DevSreFeat - Diagnostico Seguro

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operacao autorizada (sem deploy)"
        required: true
        type: choice
        default: connection-check
        options:
          - connection-check
          - tooling-apex-summary
          - apex-tests

permissions:
  contents: read

concurrency:
  group: sf-devsrefeat-read
  cancel-in-progress: false

jobs:
  diagnose:
    name: Run on DevSreFeat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: sf-devsrefeat-read
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
      SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - name: Validate target and required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SF_INSTANCE_URL:-}" != "https://yduqs--devsrefeat.sandbox.my.salesforce.com" ]]; then
            echo "::error::Expected DevSreFeat My Domain in Environment variable SF_INSTANCE_URL"
            exit 2
          fi
          for required in SF_CLIENT_ID SF_USERNAME SF_JWT_KEY; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::Required Environment secret is not configured: $required"
              exit 2
            fi
          done
          echo "Configured target: DevSreFeat (sandbox)"

      - name: Checkout audited repository revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate through Salesforce ECA/JWT
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/sf-devsrefeat.key"

          # Detect malformed/truncated secrets without printing the private key.
          if ! openssl pkey -in "$RUNNER_TEMP/sf-devsrefeat.key" -noout -passin pass: >/dev/null 2>&1; then
            echo "::error title=JWT_KEY_INVALID::SF_JWT_KEY is not a valid unencrypted PEM private key. Check multi-line GitHub Environment Secret."
            exit 1
          fi

          # Keep Salesforce's raw stdout/stderr private; GitHub repo is public.
          if sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --username "$SF_USERNAME" \
            --jwt-key-file "$RUNNER_TEMP/sf-devsrefeat.key" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias devsrefeat-ci \
            --json > "$RUNNER_TEMP/sf-auth.json" 2> "$RUNNER_TEMP/sf-auth.err"; then
            echo "Salesforce JWT authentication completed."
          else
            # Classify only known errors. NEVER echo raw JSON/stderr: they can
            # include Salesforce identifiers, usernames, URLs or tokens.
            if grep -Eiq "user hasn't approved this consumer|user has not approved this consumer|user is not admin approved|not approved" "$RUNNER_TEMP/sf-auth.json" "$RUNNER_TEMP/sf-auth.err"; then
              echo "::error title=JWT_USER_NOT_PREAUTHORIZED::Check ECA permitted users, assigned permission set and integration user."
            elif grep -Eiq "client identifier invalid|invalid client id|invalid_client|client id is invalid" "$RUNNER_TEMP/sf-auth.json" "$RUNNER_TEMP/sf-auth.err"; then
              echo "::error title=JWT_CLIENT_ID_INVALID::Check SF_CLIENT_ID against Consumer Key of the DevSreFeat ECA."
            elif grep -Eiq "audience is invalid|invalid audience|audience.*invalid" "$RUNNER_TEMP/sf-auth.json" "$RUNNER_TEMP/sf-auth.err"; then
              echo "::error title=JWT_AUDIENCE_INVALID::Review My Domain URL and Salesforce login/audience policy."
            elif grep -Eiq "invalid signature|signature validation failed|signature is invalid|certificate.*(invalid|mismatch)" "$RUNNER_TEMP/sf-auth.json" "$RUNNER_TEMP/sf-auth.err"; then
              echo "::error title=JWT_CERT_MISMATCH::Check uploaded ECA certificate matches the private key in the GitHub Environment Secret."
            elif grep -Eiq "ip restricted|ip_restricted" "$RUNNER_TEMP/sf-auth.json" "$RUNNER_TEMP/sf-auth.err"; then
              echo "::error title=JWT_IP_RESTRICTED::Inspect Salesforce IP access policies for the integration user."
            elif grep -Eiq "expired|assertion.*invalid|invalid_grant|jwt.*flow.*disabled" "$RUNNER_TEMP/sf-auth.json" "$RUNNER_TEMP/sf-auth.err"; then
              echo "::error title=JWT_GRANT_REJECTED::Review JWT Bearer Flow activation, app policy, certificate, user and time synchronization."
            else
              echo "::error title=JWT_AUTH_UNCLASSIFIED::OAuth login failed but raw error was withheld to protect this public repository; review the ECA and Salesforce Login History."
            fi
            exit 1
          fi

      - name: Execute allowlisted operation (sanitized output)
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            connection-check)
              sf org display --target-org devsrefeat-ci --json > "$RUNNER_TEMP/sf-org.json"
              echo "Salesforce org connection verified (details intentionally omitted)."
              ;;
            tooling-apex-summary)
              sf data query \
                --use-tooling-api \
                --query "SELECT Id FROM ApexClass LIMIT 25" \
                --target-org devsrefeat-ci \
                --json > "$RUNNER_TEMP/sf-tooling.json"
              jq -e '.status == 0' "$RUNNER_TEMP/sf-tooling.json" > /dev/null
              echo "Tooling API reachable. Sample ApexClass records: $(jq -r '.result.totalSize' "$RUNNER_TEMP/sf-tooling.json")"
              ;;
            apex-tests)
              # Before execution, verify all four repository tests exist in the org.
              # Never publish class source, per-method output or Salesforce error JSON.
              if ! sf data query \
                --use-tooling-api \
                --query "SELECT Name FROM ApexClass WHERE Name IN ('ClonePipelineControllerTest','CompareSecurityCodeTest','GeradorSenhaInicialTest','SendEmailInvocableTest') LIMIT 4" \
                --target-org devsrefeat-ci \
                --json > "$RUNNER_TEMP/sf-test-precheck.json" 2> "$RUNNER_TEMP/sf-test-precheck.err"; then
                echo "::error title=APEX_TEST_PREFLIGHT_ERROR::Unable to verify test class availability via Tooling API."
                exit 1
              fi
              found=$(jq -r '(.result.records // []) | map(.Name) | unique | length' "$RUNNER_TEMP/sf-test-precheck.json")
              if [[ "$found" != "4" ]]; then
                echo "::error title=APEX_TEST_CLASSES_MISSING::Only $found of 4 expected test classes were found in DevSreFeat. Check Apex Classes in the sandbox before retrying."
                exit 1
              fi
              echo "Apex test preflight: 4 of 4 expected classes located in the sandbox."

              # An Apex run may return nonzero because the tests FAIL, not
              # necessarily because invoking the test runner itself failed.
              sf_exit=0
              sf apex run test \
                --class-names ClonePipelineControllerTest \
                --class-names CompareSecurityCodeTest \
                --class-names GeradorSenhaInicialTest \
                --class-names SendEmailInvocableTest \
                --code-coverage \
                --wait 60 \
                --target-org devsrefeat-ci \
                --json > "$RUNNER_TEMP/sf-test.json" 2> "$RUNNER_TEMP/sf-test.err" || sf_exit=$?

              if jq -e 'type == "object"' "$RUNNER_TEMP/sf-test.json" >/dev/null 2>&1; then
                # Whitelist only aggregate numbers and an allowed outcome.
                read -r ran passed failed < <(jq -r '
                  def n: if type == "number" and . >= 0 then tostring else "unknown" end;
                  [(.result.summary.testsRan | n), (.result.summary.passing | n), (.result.summary.failing | n)] | @tsv
                ' "$RUNNER_TEMP/sf-test.json" 2>/dev/null || echo "unknown unknown unknown")
                outcome=$(jq -r '.result.summary.outcome // "unknown" | if .=="Passed" or .=="Failed" or .=="Pending" then . else "unknown" end' "$RUNNER_TEMP/sf-test.json" 2>/dev/null || echo "unknown")
                echo "APEX_TEST_SUMMARY: total=$ran passed=$passed failed=$failed outcome=$outcome"
              else
                ran="unknown"; passed="unknown"; failed="unknown"; outcome="unknown"
                echo "APEX_TEST_SUMMARY: structured result unavailable (details withheld)"
              fi

              if [[ "$sf_exit" -eq 0 && "$outcome" != "Failed" ]]; then
                echo "Apex CLI test command completed without error."
              elif [[ "$failed" =~ ^[0-9]+$ && "$failed" -gt 0 ]] || [[ "$outcome" == "Failed" ]]; then
                echo "::error title=APEX_TEST_FAILURE::One or more Apex test methods failed. Review Setup > Apex Test Execution within the sandbox for method-level details."
                exit 1
              elif grep -Eiq "View All Data|INSUFFICIENT_ACCESS|insufficient privileges|permission denied|not authorized" "$RUNNER_TEMP/sf-test.json" "$RUNNER_TEMP/sf-test.err"; then
                echo "::error title=APEX_TEST_PERMISSION::Check the integration user's Apex test execution permissions. Do not grant View All Data without a security review."
                exit 1
              elif grep -Eiq "test class.*not found|invalid test class|no tests found|test class.*does not exist" "$RUNNER_TEMP/sf-test.json" "$RUNNER_TEMP/sf-test.err"; then
                echo "::error title=APEX_TEST_CLASS_ERROR::One or more specified test classes could not be executed; verify they are active and deployed."
                exit 1
              elif grep -Eiq "timed out|timeout|socket timeout" "$RUNNER_TEMP/sf-test.json" "$RUNNER_TEMP/sf-test.err"; then
                echo "::error title=APEX_TEST_TIMEOUT::Check Salesforce Apex Test Execution before retrying; a test run may still be executing."
                exit 1
              else
                echo "::error title=APEX_TEST_UNCLASSIFIED::Salesforce returned an unsuccessful test command without an allowed diagnostic. Check Apex Test Execution in the sandbox."
                exit 1
              fi
              ;;
            *)
              echo "::error::Operation not in allowlist"
              exit 2
              ;;
          esac

      - name: Remove temporary credentials and local outputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sf-devsrefeat.key" \
            "$RUNNER_TEMP/sf-auth.json" "$RUNNER_TEMP/sf-auth.err" \
            "$RUNNER_TEMP/sf-org.json" "$RUNNER_TEMP/sf-tooling.json" \
            "$RUNNER_TEMP/sf-test.json" "$RUNNER_TEMP/sf-test.err" \
            "$RUNNER_TEMP/sf-test-precheck.json" "$RUNNER_TEMP/sf-test-precheck.err"
